  unsubs.push(u);
  $("#send").onclick = async () => {
    const problems = [...rows.children].map(r => { const ext = JSON.parse(r.dataset.ext||"{}"), q = r.querySelector("[data-q]").value.trim(), ans = r.querySelector("[data-a]").value.trim(); return {kind:"", simp:false, stage:"", ...ext, ...(ext.kind ? {} : {kind:""}), q, ans}; }).filter(p => p.q);
    const title = $("#title").value.trim();
    if(!title) return toast("제목을 써 주세요");
    if(!problems.length) return toast("문제를 하나 이상 넣어 주세요");
    const minutes = T ? +$("#mins").value : 0;
    if(!await ask(T ? "시험을 낼까요?" : "숙제를 낼까요?", `${esc(title)} · ${problems.length}문제${T ? ` · ${minutes ? minutes+"분" : "시간 제한 없음"}` : ""}`, T ? "시험 내기" : "숙제 내기", "취소")) return;
    try{ await DB.createHW({title, problems, createdAt:Date.now(), status:"assigned", round:1, st:{}, grade:{}, memo:"", ...(T ? {test:true, minutes} : {})}); toast(T ? "시험을 냈어요!" : "숙제를 냈어요!"); go(teacherHome); }
    catch(e){ toast("저장 실패: 인터넷을 확인해 주세요"); }
  };
}

// ───────── 선생님: 채점 ─────────
function teacherGrade(id){
  app.onclick = null;
  let hw = null, dirty = false, built = false;
  app.innerHTML = `<div class="page"><div class="bar"><button class="link" id="back">← 목록</button><button class="link" id="del" style="color:var(--bad)">숙제 지우기</button></div>
    <div id="upd" class="banner hide"><span>${esc(STUDENT)}가 새로 풀었어요.</span><button class="btn" id="reload">새로 보기</button></div>
    <div id="body"></div>
    <div class="card"><h2>💬 ${esc(STUDENT)}와 대화</h2><div id="chat"></div></div></div>`;
  $("#back").onclick = async () => { if(dirty && !await ask("채점을 저장하지 않았어요", "저장하지 않고 나갈까요?", "나가기", "취소")) return; go(teacherHome); };
  $("#del").onclick = async () => { if(await ask("숙제를 지울까요?", "지우면 되돌릴 수 없어요.", "지우기", "취소")){ await DB.deleteHW(id); go(teacherHome); } };
  $("#reload").onclick = () => { dirty = false; render(); };
  unsubs.push(chatBox($("#chat"), id, "teacher"));

  async function render(){
    $("#upd").classList.add("hide");
    const h = hw, n = h.problems.length, [lab,cls] = statusOf(h), canGrade = ["submitted","graded"].includes(h.status);
    const ok1N = h.problems.filter((_,i)=>stOf(h,i).ok1===true).length, finN = h.problems.filter((_,i)=>finalOk(h,i)===true).length;
    const note = await DB.getNote(id);
    $("#body").innerHTML = `<div class="card">
        <div class="row" style="justify-content:space-between"><span class="jua" style="font-size:26px">${esc(h.title)}</span><span class="chip ${cls}">${lab}</span></div>
        <div class="muted" style="margin-top:4px">낸 날 ${fmtD(h.createdAt)}${h.submittedAt ? ` · 제출한 날 ${fmtD(h.submittedAt)}` : ""}</div>
        ${h.st && h.st.tm ? `<div style="margin-top:4px;font-size:17px">⏱ 푸는 데 걸린 시간 <b>${fmtSec(h.st.tm)}</b> <span class="muted">(화면 켜고 푼 시간만)</span></div>` : ""}
        ${evLine(h) ? `<details style="margin-top:4px;font-size:16px"><summary style="cursor:pointer">${evLine(h)}</summary><div class="muted" style="margin-top:4px;line-height:1.7">${evSum(h).ev.slice().sort((a,b) => a.s-b.s).map(e => `${hm(e.s)} · ${e.i>=0 ? `${e.i+1}번 문제에서 ` : ""}${e.k==="out" ? "🚪 나갔다 옴" : "💤 멈춤"} ${fmtSec(e.d)}`).join("<br>")}</div></details>` : ""}
        ${canGrade ? `<div class="sum" style="margin-top:8px">1번째 ${ok1N}/${n} 맞음 → 최종 ${finN}/${n} 맞음 <span class="muted">(자동 채점)</span></div>` : `<div class="muted" style="margin-top:8px">${esc(STUDENT)}가 아직 제출하지 않았어요. 풀고 있는 녹화는 지금도 볼 수 있어요.</div>`}
      </div>
      <div class="card"><h2>문제별 채점</h2>${h.problems.map((p,i) => {
        const s = stOf(h,i), gr = (h.grade && h.grade[i]) || {}, ok = gradeOk(h,i);
        const line = (k) => { const a = s["a"+k], o = s["ok"+k]; if(!has(a) && k===2) return ""; return `<div class="att"><span class="lb">${k}번째 답</span><b>${esc(a ?? "-")}</b> ${o===true ? `<span class="okc">✔ 맞음</span>` : o===false ? `<span class="badc">✗ 틀림</span>` : ""} <button class="btn" data-q="${p.kind==="div" ? esc(p.q) : ""}" data-k="${recKey(id,i,k)}" data-t="${i+1}번 ${esc(p.q)} · ${k}번째 풀이">▶ 풀이 보기</button></div>`; };
        return `<div class="gq" data-i="${i}"><div class="top"><span class="no">${i+1}번</span><span class="qq">${richQ(p.q)}</span><span class="muted">정답 ${has(p.ans) ? esc(p.ans) : "(직접 채점)"}</span><span class="muted">· 풀이 ${attempts(h,i)}회</span>${s.t ? `<span class="muted">· ⏱ ${fmtSec(s.t)}</span>` : ""}</div>
          ${line(1)}${line(2)}
          <div class="att"><span class="lb">채점</span><button class="btn ok ${ok===true?"on":""}" data-g="1" ${canGrade?"":"disabled"}>⭕ 맞음</button><button class="btn bad ${ok===false?"on":""}" data-g="0" ${canGrade?"":"disabled"}>❌ 틀림</button></div>
          <div class="att"><span class="lb">메모</span><input class="inp" data-m style="flex:1" placeholder="이 문제에 대한 말 (${esc(STUDENT)}에게 보여요)" value="${esc(gr.memo || "")}"></div></div>`;
      }).join("")}</div>
      <div class="card"><h2>📝 ${esc(STUDENT)}에게 한마디 <span class="muted">(${esc(STUDENT)}에게 보여요)</span></h2><textarea class="inp" id="memo" placeholder="예) 받아내림을 잘했어요! 소수점 위치만 조심해요.">${esc(h.memo || "")}</textarea></div>
      <div class="card" style="background:var(--yel)"><h2>📌 나만 보는 메모 <span class="muted">(다음 숙제 낼 때 보여요)</span></h2><textarea class="inp" id="note" placeholder="예) 자릿수 다른 뺄셈에서 빈자리 0을 안 채움 → 다음엔 5단계 더">${esc(note)}</textarea><button class="btn" id="saveNote" style="margin-top:8px">메모만 저장</button></div>
      <button class="big" id="save" ${canGrade?"":"disabled"}>${h.status==="graded" ? "채점 고친 것 저장" : "채점 완료하기"}</button>`;
    built = true;
  }
  app.onclick = async e => {
    const pb = e.target.closest("[data-k]"); if(pb) return openPlayer(pb.dataset.t, pb.dataset.k, pb.dataset.q);
    const gb = e.target.closest("[data-g]");
    if(gb && !gb.disabled){ const q = gb.closest(".gq"); q.querySelectorAll("[data-g]").forEach(b => b.classList.toggle("on", b===gb)); dirty = true; return; }
    if(e.target.id==="saveNote"){ await DB.setNote(id, $("#note").value); toast("메모를 저장했어요"); return; }
    if(e.target.id==="save"){
      const grade = {}; let miss = 0;
      document.querySelectorAll(".gq").forEach(q => { const i = q.dataset.i, on = q.querySelector("[data-g].on"); if(!on) miss++; grade[i] = {ok: on ? on.dataset.g==="1" : null, memo: q.querySelector("[data-m]").value.trim()}; });
      if(miss && !await ask("채점 안 한 문제가 있어요", `${miss}문제가 비어 있어요. 그래도 저장할까요?`, "저장", "취소")) return;
      try{
        await DB.setNote(id, $("#note").value);
        await DB.updateHW(id, {grade, memo:$("#memo").value.trim(), status:"graded", gradedAt:Date.now()});
        dirty = false; toast(`채점 완료! ${STUDENT}에게 보여요`);
      }catch(err){ toast("저장 실패: 인터넷을 확인해 주세요"); }
    }
  };
  app.oninput = e => { if(e.target.closest("#body") && e.target.id!=="note") dirty = true; };
  cleanups.push(() => { app.oninput = null; });
  unsubs.push(DB.watchHW(id, h => {
    if(!h){ go(teacherHome); return; }
    hw = h;
    if(!built || !dirty) render(); else $("#upd").classList.remove("hide");
  }));
}

// 앱 설치(홈 화면에 추가)용


// ───────── 시작 ─────────
(async () => {
  try{ DB = FIREBASE_CONFIG ? await makeFirebase() : makeLocal(); }
  catch(e){ app.innerHTML = `<div class="center"><h1>앗!</h1><p>연결할 수 없어요. 인터넷을 확인하고 새로 고침해 주세요.</p></div>`; return; }
  if(DB.mode==="local"){ const d = $("#demo"); d.classList.remove("hide"); d.innerHTML = "🧪 <b>체험 모드</b> — 지금은 이 기기에만 저장돼요. 안내서대로 설정하면 수아와 선생님이 서로 다른 기기에서 함께 쓸 수 있어요. (같은 컴퓨터에서 창을 두 개 열어 한쪽은 선생님, 한쪽은 수아로 들어가면 미리 써 볼 수 있어요.)"; }
  let first = true;
  DB.onAuth(r => {
    if(!first && r===role) return; first = false; role = r;
    if(r==="teacher") go(teacherHome);
    else if(r==="student") go(studentHome);
    else if(r==="parent") go(parentHome);
    else go(startScreen);
  });
})();
</script>
