<style>
/* 온글잎 박다현체 — (주)보이저엑스 & 박다현. 웹사이트 사용·임베딩 허용, 파일 수정 금지라 원본 그대로 씀 */
@font-face{font-family:"OwnglyphPDH";src:url("ownglyph-pdh.ttf") format("truetype");font-display:swap;size-adjust:125%}
:root{
  --bg:#fff5f9; --card:#fff; --ink:#4a3f55; --sub:#9a8aa8; --main:#ff7eb6; --main-d:#e8609c;
  --ok:#22b38a; --bad:#ff5c7a; --soft:#ffe6f1; --line:#f7dbe8; --blue:#9b8cff; --blue-d:#7d6cf0;
  --lav:#f1edff; --yel:#fff6cc;
  --disp:"OwnglyphPDH",Pretendard,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background-color:var(--bg);background-image:radial-gradient(#ffd3e6 1.3px,transparent 1.4px);background-size:24px 24px;color:var(--ink);font-family:var(--disp);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.jua,h1,h2,h3{font-family:var(--disp);font-weight:400;letter-spacing:0}
.hide{display:none!important}
.page{max-width:760px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.bar h1{font-size:36px;margin:0;color:var(--main-d)}
.link{border:0;background:none;color:var(--sub);cursor:pointer;padding:8px;font-size:15px}
.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:0 6px 20px rgba(255,126,182,.12);border:2px solid var(--line);margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:27px}
.big{display:block;width:100%;border:0;border-radius:20px;padding:14px;font-family:inherit;font-weight:800;font-size:20px;background:var(--main);color:#fff;cursor:pointer;box-shadow:0 4px 0 var(--main-d)}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 var(--main-d)}
.big.gray{background:var(--lav);color:var(--blue-d);box-shadow:0 4px 0 #dcd3ff}
.big.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.big:disabled{opacity:.45;cursor:default}
.btn{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;cursor:pointer;font-size:15px}
.btn.on{border-color:var(--main);background:var(--main);color:#fff}
.btn.ok.on{border-color:var(--ok);background:var(--ok)}
.btn.bad.on{border-color:var(--bad);background:var(--bad)}
.btn:disabled{opacity:.4;cursor:default}
.inp{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-size:16px}
.inp:focus{outline:none;border-color:var(--main)}
textarea.inp{min-height:80px;resize:vertical}
.chip{display:inline-block;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:700;background:var(--soft);color:var(--main-d);white-space:nowrap}
.chip.new{background:#ffe1ea;color:#e23d63}
.chip.ing{background:var(--yel);color:#a07400}
.chip.r2{background:#ffe1ea;color:#e23d63}
.chip.sub{background:var(--lav);color:var(--blue-d)}
.chip.done{background:#ddf7ee;color:#15936f}
.muted{color:var(--sub);font-size:14px}
.empty{color:var(--sub);font-size:14px;padding:6px 0}
.demo{background:var(--yel);border-radius:12px;padding:10px 14px;font-size:14px;margin:0 auto 12px;max-width:760px}
.center{max-width:420px;margin:8vh auto 0;display:grid;gap:14px;text-align:center;padding:0 16px}
.center h1{font-size:62px;margin:0;color:var(--main-d);line-height:1}
.deco{font-size:28px;letter-spacing:10px}
.confetti{position:fixed;top:-40px;font-size:26px;pointer-events:none;z-index:100;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
.hwlist{display:grid;gap:10px}
.hw{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:20px;padding:14px 16px;box-shadow:0 3px 0 var(--line);cursor:pointer}
.hw .ti{font-family:var(--disp);font-weight:400;font-size:27px;line-height:1.1}
.hw .grow{flex:1;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--blue-d);font-weight:700;color:#fff;padding:10px 18px;border-radius:99px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99;max-width:90vw;text-align:center}
.toast.show{opacity:1}

/* 문제 풀기 화면 */
.solve{position:fixed;inset:0;display:grid;grid-template-columns:260px 1fr;background:var(--bg)}
.plist{display:flex;flex-direction:column;border-right:2px solid var(--line);background:#fffafd;padding:calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));min-height:0}
.plist .ph{display:flex;align-items:center;justify-content:space-between}
.plist .ph .jua{font-size:24px}
.rinfo{font-size:13px;border-radius:10px;padding:6px 10px;margin:6px 0 8px;background:var(--soft)}
.rinfo.r2{background:#ffe1ea;color:var(--bad);font-weight:700}
.items{flex:1;overflow-y:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:6px;align-content:start;padding:2px}
.it{width:100%;min-width:0;display:flex;align-items:center;gap:8px;border:2px solid transparent;background:#fff;border-radius:16px;padding:10px;cursor:pointer;text-align:left;box-shadow:0 1px 0 var(--line)}
.it.cur{border-color:var(--main);background:var(--soft)}
.it .n{font-family:inherit;font-weight:800;width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--main-d);display:flex;align-items:center;justify-content:center;flex:none}
.it.cur .n{background:var(--main);color:#fff}
.it .q{flex:1;min-width:0;font-family:inherit;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .s{font-size:12px;text-align:right;white-space:nowrap}
.it .s b{display:block;font-size:18px}
.it.locked{opacity:.6}
.plist .big{margin-top:8px;font-size:18px;padding:12px 8px}
.pmain{display:flex;flex-direction:column;min-height:0;min-width:0;padding:calc(10px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom))}
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.phead .no{font-family:inherit;font-weight:800;font-size:22px}
.pq{font-family:inherit;font-weight:800;font-size:34px;margin:6px 0 8px;word-break:keep-all}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tool{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;cursor:pointer;font-size:15px;display:flex;align-items:center;gap:6px}
.tool.on{border-color:var(--main);background:var(--soft)}
.dot{width:16px;height:16px;border-radius:50%;display:inline-block}
.boardwrap{flex:1;min-height:200px;display:flex;align-items:flex-start;justify-content:center;overflow:hidden}
.boardwrap canvas{background-color:#fff;background-image:linear-gradient(#f0ebff 1px,transparent 1px),linear-gradient(90deg,#f0ebff 1px,transparent 1px);background-size:28px 28px;border-radius:20px;box-shadow:0 0 0 3px var(--line);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;display:block}
.ansrow{display:flex;gap:8px;align-items:center;margin-top:10px}
.ansrow .lab{font-family:inherit;font-weight:800;font-size:22px}
.ansrow .inp{font-family:inherit;font-weight:800;font-size:24px;max-width:220px}
.ansrow .big{width:auto;padding:10px 18px;font-size:20px}
.anote{font-size:14px;margin-top:6px;min-height:20px}
.lockmsg{font-family:inherit;font-weight:800;font-size:20px;color:var(--ok);margin-bottom:6px}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(90px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:26px;box-shadow:0 4px 12px rgba(0,0,0,.2);cursor:pointer;z-index:20}
.fab .nd{position:absolute;top:4px;right:4px;width:14px;height:14px;border-radius:50%;background:var(--bad);border:2px solid #fff}
@media (max-width:700px){
  .solve{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .plist{border-right:0;border-bottom:2px solid var(--line);min-width:0;padding-bottom:8px}
  .items{display:flex;overflow-x:auto;overflow-y:hidden;flex:none;padding-bottom:4px}
  .it{flex:none;width:auto;padding:8px}
  .it .s{font-size:0}
  .it .s b{font-size:16px}
  .plist .big{padding:10px 8px;font-size:17px}
  .rinfo{margin:4px 0 6px}
  .pmain{padding-top:8px}
  .tools{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
  .tool{flex:none}
  .ansrow{flex-wrap:wrap}
  .fab{width:48px;height:48px;font-size:22px;bottom:calc(140px + env(safe-area-inset-bottom))}
  .it .q{display:none}
  .pq{font-size:26px}
}

/* 채팅 */
.chat{display:flex;flex-direction:column;gap:8px}
.msgs{max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px}
.msg{max-width:80%;align-self:flex-start}
.msg.me{align-self:flex-end;text-align:right}
.msg .who{font-size:12px;color:var(--sub)}
.msg .bub{display:inline-block;background:var(--soft);border-radius:14px;padding:8px 12px;white-space:pre-wrap;word-break:break-word;text-align:left}
.msg.me .bub{background:var(--blue);color:#fff}
.msg .when{font-size:11px;color:var(--sub)}
.cin{display:flex;gap:8px}
.cin .big{width:auto;padding:10px 16px;font-size:18px;white-space:nowrap;flex:none}

/* 창 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.mbox{background:#fff;border-radius:26px;border:3px solid var(--line);padding:18px;width:100%;max-width:420px;max-height:92vh;overflow:auto}
.mbox.wide{max-width:900px;display:flex;flex-direction:column;height:88vh}
.mbox h3{margin:0 0 8px;font-size:22px}
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.mbtns.one{grid-template-columns:1fr}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,92vw);background:#fff;box-shadow:-4px 0 16px rgba(0,0,0,.15);z-index:40;padding:calc(14px + env(safe-area-inset-top)) 14px 14px;display:flex;flex-direction:column}
.drawer .msgs{max-height:none;flex:1}
.drawer .chat{flex:1;min-height:0}
.pctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.pctl input[type=range]{flex:1;min-width:140px}
.pctl .tm{font-family:inherit;font-weight:800;min-width:90px;text-align:center}

/* 채점 */
.gq{border-top:1px dashed var(--line);padding:12px 0}
.gq:first-of-type{border-top:0}
.gq .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gq .no{font-family:inherit;font-weight:800;font-size:20px}
.gq .qq{font-family:inherit;font-weight:800;font-size:22px}
.att{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:15px}
.att .lb{color:var(--sub);width:72px}
.okc{color:var(--ok);font-weight:700}
.badc{color:var(--bad);font-weight:700}
.prow{display:grid;grid-template-columns:28px 1fr 120px 36px;gap:6px;align-items:center;margin-bottom:6px}
.prow .n{font-family:inherit;font-weight:800;text-align:center}
.sum{font-family:inherit;font-weight:800;font-size:20px}
.mix{display:inline-flex;align-items:center;gap:2px;vertical-align:middle}
.fr{display:inline-flex;flex-direction:column;align-items:center;font-size:.62em;line-height:1.08;margin:0 3px}
.fr span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.inp.sm{width:72px;text-align:center;font-family:inherit;font-weight:800;font-size:24px;padding:6px}
.fin{display:inline-flex;flex-direction:column;gap:3px}
.fin .fl{height:3px;background:var(--ink);border-radius:2px}
.lab2{font-family:inherit;font-weight:800;font-size:18px}
.ugrp{margin:8px 0}
.ugrp .row{margin-top:4px}
.pq,.it .q,.ansrow .inp,.inp.sm,.gq .qq,.prow .inp,.att b,.fr{font-family:Pretendard,"Noto Sans KR",sans-serif}
.banner{background:var(--lav);color:var(--blue-d);border-radius:12px;padding:10px 12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}

/* 플래너 알림 */
.pnote{display:flex;align-items:center;gap:6px;width:100%;margin:0 0 12px;padding:14px 16px;border:3px dashed var(--main);border-radius:18px;background:#fff0f6;color:var(--main-d);font-family:var(--disp);font-size:20px;cursor:pointer;text-align:left;animation:pnb 1.6s ease-in-out infinite}
.pnote .pt{flex:1;min-width:0}.pnote .go{font-size:16px;white-space:nowrap;background:var(--main);color:#fff;border-radius:99px;padding:4px 12px}
@media (max-width:520px){.pnote{font-size:17px}}
@keyframes pnb{50%{transform:scale(1.015)}}
.card.glow{box-shadow:0 0 0 4px var(--main),0 8px 26px #ff7eb655;transition:box-shadow .3s}
/* 영어공부 */
.stabs{display:flex;gap:8px;margin:0 0 14px}
.stab{flex:1;border:3px solid var(--line);background:#fff;border-radius:18px;padding:12px 8px;font-size:21px;cursor:pointer;font-family:var(--disp);color:var(--sub)}
.stab.on{border-color:var(--main);background:var(--soft);color:var(--main-d)}
.stab{position:relative}.nb{position:absolute;top:-6px;right:-4px;background:var(--bad);color:#fff;border-radius:99px;min-width:22px;height:22px;font-size:14px;line-height:22px;padding:0 6px;font-family:Pretendard,sans-serif;font-weight:800}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.eunit{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px;border:2px solid var(--line);border-radius:18px;background:#fff;font-size:19px;cursor:pointer;font-family:var(--disp)}
.eunit:active{transform:scale(.97)}
.eunit.ph{background:var(--lav);border-color:#d9d0ff}
.eic{font-size:36px;line-height:1.1}
.eplay{position:relative;min-height:420px}
.ecard{text-align:center;padding:10px 6px}
.eemo{font-size:78px;line-height:1.15}
.eword{font-family:Pretendard,sans-serif;font-weight:800;font-size:46px;color:var(--ink);margin:4px 0}
.emean{font-size:26px;color:var(--main-d);margin:2px 0 10px}
.spk{font-size:17px}
.eopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.eopts.one{grid-template-columns:1fr}.eopt.on2{border-color:var(--main)}.eopts.four{grid-template-columns:repeat(4,1fr)}.eopts.five{grid-template-columns:repeat(5,1fr)}
.eopt{border:2px solid var(--line);background:#fff;border-radius:16px;padding:16px 8px;font-size:22px;cursor:pointer;font-family:var(--disp)}
.eopt.big2{font-family:Pretendard,sans-serif;font-weight:800;font-size:30px}
.eopt.ok{border-color:var(--ok);background:#e6f8f1}.eopt.bad{border-color:var(--bad);background:#ffe9ee}
.efb{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:#fff;border-radius:22px;padding:16px 26px;font-size:30px;text-align:center;box-shadow:0 8px 30px #0002;pointer-events:none;animation:pop .25s ease-out}
.efb.ok{color:var(--ok)}.efb.bad{color:var(--bad)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.6);opacity:0}}
.eslots{display:flex;justify-content:center;gap:6px;margin:10px 0;flex-wrap:wrap}
.eslot{width:44px;height:54px;border-bottom:4px solid var(--line);font-family:Pretendard,sans-serif;font-weight:800;font-size:34px;display:flex;align-items:center;justify-content:center}
.eslot.on{border-color:var(--main)}
.etiles{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:8px}
.etile{width:52px;height:56px;border:2px solid var(--line);border-radius:14px;background:var(--yel);font-family:Pretendard,sans-serif;font-weight:800;font-size:28px;cursor:pointer}
.etile:disabled,.echip:disabled{opacity:.25}
.echip{border:2px solid var(--line);border-radius:14px;background:var(--yel);padding:10px 14px;font-family:Pretendard,sans-serif;font-weight:700;font-size:24px;cursor:pointer}
.echip.on{background:#fff;border-color:var(--main)}
.eline{min-height:60px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;border:2px dashed var(--line);border-radius:16px;padding:8px;margin-top:10px}
.einput{display:block;margin:8px auto 0;max-width:420px;text-align:center;font-family:Pretendard,sans-serif;font-weight:700;font-size:30px}
@media (max-width:520px){.eword{font-size:36px}.eopts.four,.eopts.five{grid-template-columns:repeat(3,1fr)}.stab{font-size:17px}}
</style>
</head>

function makeLocal(){
  const K = "sua-hw-demo", blank = () => ({hw:{}, rec:{}, msgs:{}, notes:{}, photos:{}, pfull:{}});
  const load = () => { try{ return JSON.parse(localStorage.getItem(K)) || blank(); }catch(e){ return blank(); } };
  let D = load(); const subs = new Set();
  const emit = () => subs.forEach(f => f());
  const save = (quiet) => { try{ localStorage.setItem(K, JSON.stringify(D)); }catch(e){ toast("저장 공간이 부족해요"); } if(!quiet) emit(); };
  window.addEventListener("storage", e => { if(e.key===K){ D = load(); emit(); } });
  const sub = f => { subs.add(f); Promise.resolve().then(() => subs.has(f) && f()); return () => subs.delete(f); };
  const clone = o => JSON.parse(JSON.stringify(o));
  const setPath = (o, path, v) => { const ks = path.split("."); let c = o; for(let i=0;i<ks.length-1;i++){ if(!c[ks[i]] || typeof c[ks[i]]!=="object") c[ks[i]] = {}; c = c[ks[i]]; } c[ks[ks.length-1]] = v; };
  let roleCb = null;
  const getRole = () => { try{ return sessionStorage.getItem(K+"-role"); }catch(e){ return null; } };
  const setRole = r => { try{ r ? sessionStorage.setItem(K+"-role", r) : sessionStorage.removeItem(K+"-role"); }catch(e){} roleCb && roleCb(r); };
  return {
    mode:"local",
    onAuth(cb){ roleCb = cb; cb(getRole()); },
    async loginTeacher(){ setRole("teacher"); },
    async enterStudent(){ setRole("student"); },
    async enterParent(){ setRole("parent"); },
    async logout(){ setRole(null); },
    watchHWList(cb){ return sub(() => cb(Object.entries(D.hw).map(([id,h]) => ({id, ...clone(h)})).sort((a,b) => b.createdAt-a.createdAt))); },
    watchHW(id, cb){ return sub(() => cb(D.hw[id] ? {id, ...clone(D.hw[id])} : null)); },
    async createHW(o){ const id = "h"+Date.now().toString(36); D.hw[id] = clone(o); save(); return id; },
    async updateHW(id, p){ for(const [k,v] of Object.entries(p)) setPath(D.hw[id], k, v); save(); },
    async deleteHW(id){ delete D.hw[id]; delete D.msgs[id]; save(); },
    async saveRec(k, o){ D.rec[k] = o; save(true); },
    async delRec(k){ delete D.rec[k]; save(true); },
    async loadRec(k){ return D.rec[k] ? clone(D.rec[k]) : null; },
    watchMsgs(id, cb){ return sub(() => cb(clone(D.msgs[id] || []))); },
    async addMsg(id, m){ (D.msgs[id] = D.msgs[id] || []).push(m); save(); },
    async getNote(id){ return D.notes[id] || ""; },
    async setNote(id, t){ D.notes[id] = t; save(true); },
    async getConfig(){ return D.config ? clone(D.config) : null; },
    watchPhotos(cb, n=30){ return sub(() => cb(Object.entries(D.photos||{}).map(([id,p]) => ({id, ...p})).sort((a,b) => b.at-a.at).slice(0,n))); },
    async addPhoto(meta, full){ const id = "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,5); (D.photos = D.photos||{})[id] = meta; (D.pfull = D.pfull||{})[id] = full; save(); },
    async getPhotoFull(id){ return (D.pfull||{})[id] || null; },
    async updatePhoto(id, p){ Object.assign(D.photos[id], p); save(); },
    async deletePhoto(id){ delete D.photos[id]; delete (D.pfull||{})[id]; save(); },
    async setConfig(o){ D.config = clone(o); save(true); },
    async createHWId(id, o){ D.hw[id] = clone(o); save(); },
    async addEng(o){ (D.eng = D.eng||[]).push(clone(o)); save(); },
    watchEng(cb){ return sub(() => cb(clone(D.eng||[]).sort((a,b) => b.at-a.at))); },
  };
}

// ───────── 정답 확인 ─────────
function parseFrac(s){ // "2 3/5", "3/5", "2" → [분자, 분모] (가분수 값)
  const m = /^(?:(\d+)(?:\s+|$))?(?:(\d+)\s*\/\s*(\d+))?$/.exec(String(s ?? "").trim());
  if(!m || (!m[1] && !m[2])) return null;
  const w = +(m[1]||0), n = +(m[2]||0), d = +(m[3]||1);
  if(!d) return null;
  return [w*d+n, d];
}
function checkAns(a, key, kind, simp, form){
  const nums = s => (String(s ?? "").match(/\d+(?:\.\d+)?/g)||[]).map(Number);
  const same = (p,q) => p.length===q.length && p.every((v,i) => Math.abs(v-q[i])<1e-9);
  if(kind==="set"){ const p = nums(a).sort((u,v)=>u-v), q = nums(key).sort((u,v)=>u-v); return p.length>0 && same(p,q) && new Set(p).size===p.length; }
  if(kind==="ratio" || kind==="divd") return same(nums(a), nums(key));
  if(kind==="frac2"){ const p = String(a ?? "").split(","), q = String(key).split(","); return p.length===q.length && p.every((v,i) => same(nums(v), nums(q[i]))); }
  if(kind==="cmp") return String(a ?? "").trim()===String(key).trim();
  if(kind==="text") return String(a ?? "").replace(/\s+/g,"")===String(key).replace(/\s+/g,"") && !!String(a ?? "").trim();
  if(kind==="pct"){ a = String(a ?? "").replace(/%/g,""); kind = "num"; }
  const n = s => String(s ?? "").trim().replace(/\s+/g," ").replace(/,/g,"");
  const x = n(a), y = n(key); if(!x) return false;
  if(kind==="frac"){
    const p = parseFrac(x), q = parseFrac(y); if(!(p && q) || p[0]*q[1]!==q[0]*p[1]) return false;
    if(simp){ const m = /(\d+)\s*\/\s*(\d+)$/.exec(x); if(m && gcd(+m[1], +m[2])!==1) return false; }  // 5·6학년: 기약분수로 써야 정답
    const m = /^(?:(\d+)\s+)?(\d+)\/(\d+)$/.exec(x);
    if(form==="improper" && !(m && !m[1])) return false;                       // 가분수로: 자연수 칸 없이
    if(form==="mixed" && !(m && m[1] && +m[2] < +m[3])) return false;          // 대분수로: 자연수 + 진분수
    return true;
  }
  if(kind==="div"){ const p = (x.match(/\d+/g)||[]).map(Number), q = (y.match(/\d+/g)||[]).map(Number); return p.length>0 && p[0]===q[0] && (p[1]||0)===(q[1]||0); }
  const num = /^-?\d*\.?\d+$|^-?\d+\.$/;
  if(num.test(x) && num.test(y)) return Math.abs(parseFloat(x) - parseFloat(y)) < 1e-9;
  return x.replace(/ /g,"") === y.replace(/ /g,"");
}

// ───────── 단원별 문제 만들기 ─────────
const ri = (a,b) => a + Math.floor(Math.random()*(b-a+1));
// 소수 (0.01 단위 정수로 계산 → 오차 없음)
const v1 = () => ri(0,9)*100 + ri(1,9)*10;
const f2 = () => { let f; do{ f = ri(1,99); }while(f%10===0); return f; };
const v2 = () => ri(0,9)*100 + f2();
function toStr(h,d){ const i=Math.floor(h/100), f=h%100; if(d===0) return String(i); if(d===1) return i+"."+Math.floor(f/10); return i+"."+String(f).padStart(2,"0"); }
const ansStr = h => toStr(h,2).replace(/0+$/,"").replace(/\.$/,"");
const decQ = p => ({q:`${toStr(p.a,p.da)} ${p.op} ${toStr(p.b,p.db)}`, ans:ansStr(p.op==="+" ? p.a+p.b : p.a-p.b), kind:"dec"});
function d1(h){ let ai,at,bi,bt; do{ ai=ri(0,9); at=ri(1,9); bi=ri(0,9); bt=ri(1,9); }while(h ? at+bt<10 : at+bt>9); return decQ({a:ai*100+at*10,da:1,b:bi*100+bt*10,db:1,op:"+"}); }
function d2(h){ let ai,at,bi,bt,a,b; do{ ai=ri(1,9); at=ri(1,9); bi=ri(0,ai); bt=ri(1,9); a=ai*100+at*10; b=bi*100+bt*10; }while(a<=b || (h ? at>=bt : at<bt)); return decQ({a,da:1,b,db:1,op:"−"}); }
function d3(h){ let a,b,c1,c2; do{ a=v2(); b=v2(); const ah=a%10,bh=b%10,at=Math.floor(a/10)%10,bt=Math.floor(b/10)%10; c1=ah+bh>=10; c2=at+bt+(c1?1:0)>=10; }while(h ? !(c1||c2) : (c1||c2)); return decQ({a,da:2,b,db:2,op:"+"}); }
function d4(h){ let a,b,br; do{ a=ri(1,9)*100+f2(); b=v2(); const ah=a%10,bh=b%10,at=Math.floor(a/10)%10,bt=Math.floor(b/10)%10; br=ah<bh||at<bt; }while(a<=b || (h ? !br : br)); return decQ({a,da:2,b,db:2,op:"−"}); }
function d5(h){
  if(!h){ const x={v:v1(),d:1}, y={v:v2(),d:2}; const [p,q] = Math.random()<.5 ? [x,y] : [y,x]; return decQ({a:p.v,da:p.d,b:q.v,db:q.d,op:"+"}); }
  const t = ri(1,3); let a,b,da,db;
  do{
    if(t===1){ a=ri(1,9)*100+ri(1,9)*10; da=1; b=v2(); db=2; }
    else if(t===2){ a=ri(1,9)*100+f2(); da=2; b=v1(); db=1; }
    else { a=ri(1,9)*100; da=0; if(Math.random()<.5){ b=v2(); db=2; } else { b=v1(); db=1; } }
  }while(a<=b);
  return decQ({a,da,b,db,op:"−"});
}
// 소수 사이의 관계 (0.001 단위 정수로 계산)
const th = n => { const i = Math.floor(n/1000), f = String(n%1000).padStart(3,"0").replace(/0+$/,""); return f ? `${i}.${f}` : String(i); };
function d0(h){
  const op = h ? (Math.random()<.5 ? "100배" : "1/100") : (Math.random()<.5 ? "10배" : "1/10");
  let a; do{ a = (op==="1/100" || Math.random()<.5) ? ri(1,99)*100 : ri(1,999)*10; }while(a%1000===0);
  const r = op==="10배" ? a*10 : op==="100배" ? a*100 : op==="1/10" ? a/10 : a/100;
  return {q:`${th(a)}의 ${op}${op.includes("/") ? "은" : "는"}?`, ans:th(r), kind:"dec"};
}
// 분모가 같은 분수 (값은 분자 정수로 계산)
const fr = (num,d) => { const w = Math.floor(num/d), n = num%d; return w && n ? `${w} ${n}/${d}` : w ? String(w) : `${n}/${d}`; };
const fracQ = (a,b,d,op) => ({q:`${fr(a,d)} ${op} ${fr(b,d)}`, ans:fr(op==="+" ? a+b : a-b, d), kind:"frac"});
function q1(h){ let d,a,b; do{ d=ri(3,12); a=ri(1,d-1); b=ri(1,d-1); }while(h ? a+b<=d : a+b>=d); return fracQ(a,b,d,"+"); }
function q2(h){ const d=ri(3,12); let a,b; do{ a=ri(2,d-1); b=ri(1,a-1); }while(false); return fracQ(a,b,d,"−"); }
function q3(h){ let d,n1,n2; do{ d=ri(3,10); n1=ri(1,d-1); n2=ri(1,d-1); }while(h ? n1+n2<=d : n1+n2>=d); const w1=ri(1,5), w2=ri(1,5); return fracQ(w1*d+n1, w2*d+n2, d, "+"); }
function q4(h){ let d,w1,w2,n1,n2; do{ d=ri(3,10); w1=ri(2,7); w2=ri(1,w1-1); n1=ri(1,d-1); n2=ri(1,d-1); }while(h ? n1>=n2 : n1<=n2); return fracQ(w1*d+n1, w2*d+n2, d, "−"); }

const gcd = (a,b) => { a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a; };

function mixFD(nops){
  while(true){
    const vals = [], ops = [];
    for(let i=0;i<=nops;i++){ vals.push(Math.random()<.5 ? decOf() : fracOf()); if(i<nops) ops.push(pick(["+","−","×","÷"])); }
    // 곱셈·나눗셈 먼저
    let terms = [vals[0].v], tops = [], ok = true;
    for(let i=0;i<nops;i++){ const o = ops[i], v = vals[i+1].v;
      if(o==="×") terms[terms.length-1] = rMul(terms[terms.length-1], v); else if(o==="÷") terms[terms.length-1] = rDiv(terms[terms.length-1], v); else { tops.push(o); terms.push(v); } }
    let r = terms[0]; for(let i=0;i<tops.length;i++){ r = tops[i]==="+" ? rAdd(r, terms[i+1]) : rSub(r, terms[i+1]); if(r[0]<=0) ok = false; }
    if(!ok || r[0]<=0 || r[1]>200) continue;
    return {q: vals.map((x,i) => x.s + (i<nops ? ` ${ops[i]} ` : "")).join(""), ...fAns(r[0], r[1])};
  }
}

function makeProblems(id, n){
  const st = STAGE[id], out = [], seen = new Set();
  const add = (gen, hard, sid=id) => { let p, k=0; do{ p = gen(hard); k++; }while(seen.has(p.q) && k<50); seen.add(p.q); out.push({...p, stage:sid}); };
  if(st.mix){ for(let i=0;i<n;i++){ const sid = st.mix[ri(0,st.mix.length-1)]; add(STAGE[sid].gen, Math.random()<.7, sid); } return out; }
  const review = st.prev ? Math.max(1, Math.round(n/10)) : 0, rest = n-review, easy = Math.floor(rest/2);
  for(let i=0;i<easy;i++) add(st.gen, false);          // 쉬운 문제
  for(let i=0;i<rest-easy;i++) add(st.gen, true);      // 받아올림·받아내림·나머지 있는 문제
  for(let i=0;i<review;i++) add(STAGE[st.prev].gen, true, st.prev); // 바로 앞 단계 복습
  return out;
}

const W = 1000, H = 700, ERASE_W = 36;
function drawStroke(ctx, s, lim=Infinity){
  const p = s.p; if(!p || !p.length) return;
  ctx.save();
  ctx.globalCompositeOperation = s.e ? "destination-out" : "source-over";
  ctx.strokeStyle = s.c; ctx.lineWidth = s.e ? ERASE_W : s.w; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(p[0], p[1]);
  let n = 0;
  for(let i=3;i<p.length;i+=3){ if(p[i+2] > lim) break; ctx.lineTo(p[i], p[i+1]); n++; }
  if(!n) ctx.lineTo(p[0]+0.1, p[1]);
  ctx.stroke(); ctx.restore();
}
function visibleStrokes(ev, T){ let a = []; for(const e of ev){ if(e.t > T) break; if(e.k==="s") a.push(e); else if(e.k==="c") a = []; else if(e.k==="u") a.pop(); } return a; }
function renderAt(ctx, ev, T){ ctx.clearRect(0,0,W,H); for(const s of visibleStrokes(ev,T)) drawStroke(ctx, s, T-s.t); }

class Board {
  constructor(wrap, readonly=false){
    this.wrap = wrap; this.cv = document.createElement("canvas"); wrap.appendChild(this.cv);
    this.ctx = this.cv.getContext("2d");
    this.ev = []; this.base = 0; this.t0 = performance.now(); this.readonly = readonly;
    this.tool = {c:"#222", w:4, e:0}; this.penSeen = false; this.finger = false; this.cur = null; this.dirty = false; this.onChange = null; this.paused = false;
    this.ro = new ResizeObserver(() => this.fit()); this.ro.observe(wrap);
    this.bind();
  }
  fit(){
    const r = this.wrap.getBoundingClientRect(); if(!r.width || !r.height) return;
    let w = r.width, h = w*H/W; if(h > r.height){ h = r.height; w = h*W/H; }
    const d = window.devicePixelRatio || 1;
    this.cv.style.width = w+"px"; this.cv.style.height = h+"px";
    this.cv.width = Math.round(w*d); this.cv.height = Math.round(h*d);
    this.ctx.setTransform(this.cv.width/W, 0, 0, this.cv.height/H, 0, 0);
    this.redraw();
  }
  now(){ return Math.round(this.paused ? this.base : this.base + performance.now() - this.t0); }
  pause(){ if(!this.paused){ this.base = this.now(); this.paused = true; } }
  resume(){ if(this.paused){ this.t0 = performance.now(); this.paused = false; } }
  load(rec){ this.ev = rec && rec.ev ? rec.ev : []; this.base = rec ? rec.dur||0 : 0; this.t0 = performance.now(); this.paused = false; this.dirty = false; this.cur = null; this.redraw(); }
  snap(){ return {dur:this.now(), ev:this.ev, guide:!!this.guide}; }
  redraw(T=Infinity){ renderAt(this.ctx, this.ev, T); }
  pos(e){ const r = this.cv.getBoundingClientRect(); return [Math.round((e.clientX-r.left)/r.width*W), Math.round((e.clientY-r.top)/r.height*H)]; }
  bind(){
    const c = this.cv;
    c.addEventListener("pointerdown", e => {
      if(this.readonly) return;
      if(e.pointerType==="pen") this.penSeen = true;
      if(e.pointerType==="touch" && this.penSeen && !this.finger) return;   // 펜을 쓰면 손바닥은 무시
      e.preventDefault(); try{ c.setPointerCapture(e.pointerId); }catch(_){}
      this.resume();
      const [x,y] = this.pos(e);
      this.cur = {k:"s", t:this.now(), c:this.tool.c, w:this.tool.w, e:this.tool.e, p:[x,y,0]}; this.curId = e.pointerId;
      this.ev.push(this.cur); drawStroke(this.ctx, this.cur);
    });
    c.addEventListener("pointermove", e => {
      if(!this.cur || e.pointerId!==this.curId) return; e.preventDefault();
      const list = (e.getCoalescedEvents && e.getCoalescedEvents().length) ? e.getCoalescedEvents() : [e];
      for(const ce of list){
        const [x,y] = this.pos(ce), p = this.cur.p, lx = p[p.length-3], ly = p[p.length-2];
        if(Math.abs(x-lx)+Math.abs(y-ly) < 2) continue;
        p.push(x, y, this.now()-this.cur.t); this.seg(lx,ly,x,y);
      }
    });
    const end = e => { if(!this.cur || e.pointerId!==this.curId) return; this.cur = null; this.changed(); };
    c.addEventListener("pointerup", end); c.addEventListener("pointercancel", end);
  }
  seg(x1,y1,x2,y2){ const s=this.cur, ctx=this.ctx; ctx.save(); ctx.globalCompositeOperation = s.e ? "destination-out" : "source-over"; ctx.strokeStyle = s.c; ctx.lineWidth = s.e ? ERASE_W : s.w; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore(); }
  undo(){ if(!visibleStrokes(this.ev, Infinity).length) return; this.ev.push({k:"u", t:this.now()}); this.redraw(); this.changed(); }
  clear(){ if(!visibleStrokes(this.ev, Infinity).length) return; this.ev.push({k:"c", t:this.now()}); this.redraw(); this.changed(); }
  changed(){ this.dirty = true; this.onChange && this.onChange(); }
  destroy(){ this.ro.disconnect(); this.cv.remove(); }
}

// 녹화 재생: 오래 멈춘 시간(1.5초 넘게)은 0.5초로 줄여서 보여 줘요
function compress(rec){
  const times = [];
  for(const e of rec.ev){ if(e.k==="s"){ for(let i=2;i<e.p.length;i+=3) times.push(e.t+e.p[i]); } else times.push(e.t); }
  times.sort((a,b)=>a-b);
  const Tm = [], Cm = []; let c = 0, prev = 0;
  for(const t of times){ const g = t-prev; c += g > 1500 ? 500 : g; Tm.push(t); Cm.push(c); prev = t; }
  const f = x => {
    let lo = 0, hi = Tm.length-1, k = -1;
    while(lo<=hi){ const m=(lo+hi)>>1; if(Tm[m]<=x){ k=m; lo=m+1; } else hi=m-1; }
    if(k<0) return Math.min(x, 500);
    const gapNext = k+1<Tm.length ? Cm[k+1]-Cm[k] : 500;
    return Cm[k] + Math.min(x-Tm[k], gapNext);
  };
  const ev = rec.ev.map(e => {
    if(e.k!=="s") return {...e, t:f(e.t)};
    const t = f(e.t), p = e.p.slice();
    for(let i=2;i<p.length;i+=3) p[i] = f(e.t+e.p[i]) - t;
    return {...e, t, p};
  });
  return {ev, dur:(times.length ? f(times[times.length-1]) : 0) + 300};
}

      return;

let enVoice = null;
function loadVoice(){
  if(!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices().filter(v => /^en[-_]US/i.test(v.lang));
  enVoice = vs.find(v => /Samantha|Google US|Aria|Jenny/i.test(v.name)) || vs[0] || speechSynthesis.getVoices().find(v => /^en/i.test(v.lang)) || null;
}
if("speechSynthesis" in window){ loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }
function say(text, slow=false){
  if(!("speechSynthesis" in window)){ toast("이 기기는 소리 읽기를 못 해요"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; if(enVoice) u.voice = enVoice;
  u.rate = slow ? 0.55 : 0.85; u.pitch = 1.05; speechSynthesis.speak(u);
}

    <div class="card"><h2>끝낸 시험</h2><div class="hwlist" id="tdone"></div></div>`;
}
function engRecRow(r, who="student"){
  const u = engUnit(r.unit) || {name:r.unit, icon:"🔤"};
  if(r.act==="test") return who==="student"
    ? `<div class="hw" style="cursor:default"><div class="grow"><div class="ti">📝 영어 실력 알아보기</div><div class="muted">${fmtFull(r.at)}</div></div><span class="chip ok">다 했어요 🏅</span></div>`
    : `<div class="hw" style="cursor:default;display:block"><div class="ti">📝 영어 실력 알아보기 <span class="muted" style="font-size:14px">${fmtFull(r.at)} · ${fmtSec(r.dur||0)} · ${r.score}/${r.total} 맞힘</span></div>${etestResultHTML(r)}</div>`;
  const sc = r.total ? `<div class="jua" style="font-size:20px">${r.score}/${r.total}</div>` : `<span class="chip ok">다 봤어요</span>`;
  const wrong = (r.wrong||[]).length ? `<div class="muted" style="font-size:13px">틀린 것: ${r.wrong.map(esc).join(", ")}</div>` : "";
  const vs = who!=="student" && (r.voices||[]).length ? voiceListHTML(r.voices, "🎤 따라 읽기 녹음") : "";
  return `<div class="hw" style="cursor:default;${vs ? "flex-wrap:wrap" : ""}"><div class="grow"><div class="ti">${u.icon} ${esc(u.name)} · ${esc(engActName(r.act))}</div><div class="muted">${fmtFull(r.at)}${r.dur ? ` · ${fmtSec(r.dur)}` : ""}</div>${wrong}</div>${sc}${vs ? `<div style="flex-basis:100%">${vs}</div>` : ""}</div>`;
}
function bindEngHome(limitRef){
  unsubs.push(DB.watchEng(list => { const el = $("#erec"); if(el) el.innerHTML = list.length ? list.filter(r => !r.hw).slice(0,10).map(r => engRecRow(r)).join("") : `<div class="empty">아직 없어요. 하나 해 볼까? ✨</div>`; }));
  return e => {
    const tb = e.target.closest("[data-etest]");
    if(tb){ if(limitRef() && getUsed() >= limitRef()){ tell("오늘은 여기까지! ⏰", "오늘 공부 시간을 다 썼어요. 내일 또 해요."); return true; } go(engTest); return true; }
    const b = e.target.closest("[data-eu]"); if(!b) return false;
    if(limitRef() && getUsed() >= limitRef()){ tell("오늘은 여기까지! ⏰", "오늘 공부 시간을 다 썼어요. 내일 또 해요."); return true; }
    const u = engUnit(b.dataset.eu), acts = u.id==="phonics" ? PH_ACTS : ENG_ACTS;
    const m = modal(`<h3>${u.icon} ${esc(u.name)}</h3><div class="hwlist">${acts.map(a => `<button class="hw" data-act="${a.id}"><span style="font-size:28px">${a.icon}</span><div class="grow"><div class="ti">${a.name}</div><div class="muted">${a.desc}</div></div></button>`).join("")}</div><div class="mbtns one"><button class="big gray" data-x>닫기</button></div>`);
    m.onclick = ev => { if(ev.target.closest("[data-x]")) return m.remove(); const a = ev.target.closest("[data-act]"); if(a){ m.remove(); go(engPlay, u.id, a.dataset.act); } };
    return true;
  };
}

// ───────── 영어: 공부 화면 ─────────
function engPlay(unitId, act, only, hwId){
  const u = engUnit(unitId), t0 = Date.now();
  engClock();
  app.onclick = null;
  app.innerHTML = `<div class="page"><div class="bar"><h1 style="font-size:26px">${u.icon} ${esc(u.name)} · ${esc(engActName(act))}</h1><div class="row"><span class="muted" id="eprog"></span><button class="link" id="eback">그만하기</button></div></div>
    <div class="card eplay" id="ebox"></div></div>`;
  $("#eback").onclick = async () => { if(await ask("그만할까요?", "지금 한 건 저장되지 않아요.", "그만하기", "계속하기")) go(studentHome); };
  const box = $("#ebox"), prog = $("#eprog");
  const words = u.words ? u.words.map(([w,k,e]) => ({w,k,e})) : [];
  let qs = [], i = 0, score = 0, wrong = []; const vlog = [];
  const spk = (t, slow) => `<button class="btn spk" data-say="${esc(t)}" ${slow?'data-slow="1"':""}>${slow ? "🐢 천천히" : "🔊 듣기"}</button>`;
  box.addEventListener("click", e => { const s = e.target.closest("[data-say]"); if(s) say(s.dataset.say, !!s.dataset.slow); });

  const finish = async (total) => {
    const rec = {at:Date.now(), unit:unitId, act, score, total, wrong:[...new Set(wrong)], dur:Date.now()-t0, ...(hwId ? {hw:hwId} : {}), ...(vlog.length ? {voices:vlog} : {})};
    try{
      await DB.addEng(rec);
      if(hwId) await DB.updateHW(hwId, {"st.r": {score, total, wrong:rec.wrong, dur:rec.dur, at:rec.at}, status:"submitted", submittedAt:Date.now()});
    }catch(e){ toast("기록 저장 실패: 인터넷을 확인해 주세요"); }
    if(total && score===total) confetti();
    if(hwId) prog.textContent = "";
    const msg = !total ? "끝까지 다 봤어요! 👏" : score===total ? "다 맞았어요! 최고! 🎉" : score >= total*0.7 ? "잘했어요! 👍" : "괜찮아요, 한 번 더 해 볼까? 💪";
    box.innerHTML = `<div class="center" style="min-height:0;padding:20px 0">
      <div class="jua" style="font-size:30px">${msg}</div>
      ${total ? `<div class="jua" style="font-size:54px;color:var(--main-d)">${score} / ${total}</div>` : ""}
      ${rec.wrong.length ? `<div class="muted" style="font-size:17px">틀린 것: <b>${rec.wrong.map(esc).join(", ")}</b></div>` : ""}
      ${hwId ? `<div class="chip ok" style="font-size:16px">✔ 과제 제출 완료!</div>` : ""}
      <div class="row" style="justify-content:center;margin-top:10px">
        ${rec.wrong.length && words.length ? `<button class="big" id="eagain">틀린 것만 다시</button>` : ""}
        <button class="big ${rec.wrong.length?"gray":""}" id="eredo">처음부터 다시</button><button class="big gray" id="ehome">${hwId ? "목록으로" : "다른 공부 하기"}</button></div></div>`;
    prog.textContent = "";
    $("#ehome").onclick = async () => { if(hwId) await plannerNudge(); go(studentHome); };
    $("#eredo").onclick = () => go(engPlay, unitId, act);
    if($("#eagain")) $("#eagain").onclick = () => go(engPlay, unitId, act, rec.wrong);
  };
  const nextQ = (ok, label) => {
    if(ok) score++; else wrong.push(label);
    i++; setTimeout(() => i < qs.length ? show() : finish(qs.length), ok ? 700 : 1500);
  };
  const feedback = (ok, right) => {
    const f = document.createElement("div"); f.className = "efb " + (ok ? "ok" : "bad");
    f.innerHTML = ok ? "딩동댕! ⭕" : `아쉬워요 ❌<br><span style="font-size:20px">정답: ${esc(right)}</span>`;
    box.appendChild(f);
  };
  let show = () => {};
  const pool = only ? words.filter(x => only.includes(x.w)) : words;

  if(act==="learn"){
    qs = shuffle(words);
    show = () => {
      const q = qs[i]; prog.textContent = `${i+1} / ${qs.length}`;
      box.innerHTML = `<div class="ecard"><div class="eemo">${q.e}</div><div class="eword">${esc(q.w)}</div><div class="emean">${esc(q.k)}</div>
        <div class="row" style="justify-content:center">${spk(q.w)}${spk(q.w,true)}</div></div>
        <div class="row" style="justify-content:space-between;margin-top:16px"><button class="big gray" id="eprev" ${i?"":"disabled"}>◀ 앞</button><button class="big" id="enext">${i<qs.length-1 ? "다음 ▶" : "다 외웠어요!"}</button></div>`;
      say(q.w);
      $("#eprev").onclick = () => { i--; show(); };
      $("#enext").onclick = () => { if(i < qs.length-1){ i++; show(); } else finish(0); };
    };
  }
  else if(act==="mean"){
    qs = shuffle(pool);
    show = () => {
      const q = qs[i]; prog.textContent = `${i+1} / ${qs.length}`;
      const opts = shuffle([q, ...pickN(words, 3, q)]);
      box.innerHTML = `<div class="ecard"><div class="eword">${esc(q.w)}</div><div class="row" style="justify-content:center">${spk(q.w)}</div></div>
        <div class="eopts">${opts.map(o => `<button class="eopt" data-o="${esc(o.w)}">${o.e} ${esc(o.k)}</button>`).join("")}</div>`;
      say(q.w);
      box.querySelectorAll("[data-o]").forEach(b => b.onclick = () => {
        if(box.dataset.lock==="1") return; box.dataset.lock = "1"; setTimeout(() => box.dataset.lock = "", 900);
        const ok = b.dataset.o===q.w; b.classList.add(ok ? "ok" : "bad");
        if(!ok) box.querySelector(`[data-o="${CSS.escape(q.w)}"]`).classList.add("ok");
        feedback(ok, q.k); nextQ(ok, q.w);
      });
    };
  }
  else if(act==="spell" || act==="dict"){
    qs = shuffle(pool);
    show = () => {
      const q = qs[i]; prog.textContent = `${i+1} / ${qs.length}`;
      let built = [];
      const top = act==="spell"
        ? `<div class="eemo">${q.e}</div><div class="emean">${esc(q.k)}</div>`
        : `<div class="eemo">🎧</div><div class="emean">잘 듣고 써 봐요</div><div class="row" style="justify-content:center">${spk(q.w)}${spk(q.w,true)}</div>`;
      if(act==="spell"){
        const extra = shuffle("abcdefghijklmnopqrstuvwxyz".split("").filter(c => !q.w.toLowerCase().includes(c))).slice(0, 3);
        const tiles = shuffle(q.w.split("").concat(extra)).map((c,k) => ({c, k}));
        const paint = () => {
          box.querySelector(".eslots").innerHTML = q.w.split("").map((_,k) => `<span class="eslot ${built[k]?"on":""}">${built[k] ? esc(built[k].c) : ""}</span>`).join("");
          box.querySelectorAll("[data-t]").forEach(b => b.disabled = built.some(x => x.k===+b.dataset.t));
        };
        box.innerHTML = `<div class="ecard">${top}<div class="eslots"></div></div>
          <div class="etiles">${tiles.map(t => `<button class="etile" data-t="${t.k}">${esc(t.c)}</button>`).join("")}</div>
          <div class="row" style="justify-content:center;margin-top:12px"><button class="big gray" id="edel">⌫ 지우기</button><button class="big gray" id="ehint">💡 힌트</button><button class="big" id="eok">확인 ✔</button></div>`;
        paint();
        box.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { if(built.length >= q.w.length) return; built.push(tiles.find(t => t.k===+b.dataset.t)); paint(); if(built.length===q.w.length) say(built.map(x=>x.c).join("")); });
        $("#edel").onclick = () => { built.pop(); paint(); };
        $("#ehint").onclick = () => { say(q.w); toast(`첫 글자는 "${q.w[0]}" 예요`); };
        $("#eok").onclick = () => {
          if(built.length < q.w.length) return toast("칸을 다 채워 주세요");
          if(box.dataset.lock==="1") return; box.dataset.lock = "1"; setTimeout(() => box.dataset.lock = "", 1600);
          const ok = built.map(x => x.c).join("")===q.w; feedback(ok, q.w); say(q.w); nextQ(ok, q.w);
        };
      } else {
        box.innerHTML = `<div class="ecard">${top}</div>
          <input class="inp einput" id="ein" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="여기에 영어로 써요">
          <div class="row" style="justify-content:center;margin-top:12px"><button class="big gray" id="ehint">💡 힌트</button><button class="big" id="eok">확인 ✔</button></div>`;
        setTimeout(() => say(q.w), 250);
        $("#ehint").onclick = () => toast(`${q.e} ${q.k} · ${q.w.length}글자, "${q.w[0]}"로 시작해요`);
        const check = () => {
          const v = $("#ein").value.trim(); if(!v) return toast("먼저 써 주세요");
          if(box.dataset.lock==="1") return; box.dataset.lock = "1"; setTimeout(() => box.dataset.lock = "", 1600);
          const ok = v.toLowerCase()===q.w.toLowerCase(); $("#ein").disabled = true; feedback(ok, `${q.w} (${q.k})`); nextQ(ok, q.w);
        };
        $("#eok").onclick = check; $("#ein").onkeydown = e => { if(e.key==="Enter") check(); };
      }
    };
  }
  else if(act==="sent"){
    qs = shuffle(u.sents.map(([s,k]) => ({s,k})));
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    show = () => {
      const q = qs[i]; prog.textContent = `${i+1} / ${qs.length}`;
      const toks = q.s.split(" "), chips = shuffle(toks.map((t,k) => ({t,k})));
      let built = [];
      const paint = () => {
        box.querySelector(".eline").innerHTML = built.length ? built.map((c,n) => `<button class="echip on" data-b="${n}">${esc(c.t)}</button>`).join("") : `<span class="muted">아래 단어를 순서대로 눌러요</span>`;
        box.querySelectorAll("[data-c]").forEach(b => b.disabled = built.some(x => x.k===+b.dataset.c));
        box.querySelectorAll("[data-b]").forEach(b => b.onclick = () => { built.splice(+b.dataset.b, 1); paint(); });
      };
      box.innerHTML = `<div class="ecard"><div class="emean">${esc(q.k)}</div><div class="row" style="justify-content:center">${spk(q.s)}${spk(q.s,true)}</div><div class="eline"></div></div>
        <div class="etiles">${chips.map(c => `<button class="echip" data-c="${c.k}">${esc(c.t)}</button>`).join("")}</div>
        <div class="row" style="justify-content:center;margin-top:12px"><button class="big gray" id="eclr">다시 놓기</button><button class="big" id="eok">확인 ✔</button></div>`;
      paint();
      box.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { built.push(chips.find(c => c.k===+b.dataset.c)); paint(); });
      $("#eclr").onclick = () => { built = []; paint(); };
      $("#eok").onclick = () => {
        if(built.length < toks.length) return toast("단어를 다 놓아 주세요");
        const ok = built.map(c => c.t).join(" ")===q.s;
        if(!ok){ feedback(false, q.s); say(q.s); return nextQ(false, q.s); }
        score++;
        // 맞히면 따라 읽기
        box.innerHTML = `<div class="ecard"><div class="eemo">🎉</div><div class="eword" style="font-size:30px">${esc(q.s)}</div><div class="emean">${esc(q.k)}</div>
          <div class="row" style="justify-content:center">${spk(q.s)}${spk(q.s,true)}</div><div class="muted" style="margin-top:8px">듣고 큰 소리로 따라 읽어 봐요!</div><div id="emic" class="muted"></div></div>
          <div class="row" style="justify-content:center;margin-top:12px">${(SR || (navigator.mediaDevices && window.MediaRecorder)) ? `<button class="big gray" id="erec2">🎤 읽어 보기</button>` : ""}<button class="big" id="enx">${i<qs.length-1 ? "따라 읽었어요 · 다음 ▶" : "따라 읽었어요 · 끝!"}</button></div>`;
        say(q.s);
        $("#enx").onclick = () => { i++; i < qs.length ? show() : finish(qs.length); };
        if($("#erec2")) $("#erec2").onclick = async () => {
          const btn = $("#erec2"); if(btn.dataset.busy) return; btn.dataset.busy = 1;
          btn.textContent = "⏹ 다 읽었어요"; $("#emic").textContent = "듣고 있어요… 읽어 봐요 🎤";
          const r = recordSpeech(9000); btn.onclick = () => r.stop();
          const {blob, heard} = await r.done;
          const ok = judgeSpeech({t:"read", s:q.s}, heard);
          const vid = await saveVoice({ctx:"practice", q:q.s, heard:heard||"", ok}, blob);
          if(vid || heard!=null) vlog.push({voice:vid, q:q.s, a:heard||"", ok});
          $("#emic").innerHTML = !blob && heard==null ? "마이크를 쓸 수 없어요. 그냥 소리 내서 읽어 봐요!" : ok ? `<b style="color:var(--ok)">잘 읽었어요! 👏</b>` : "녹음했어요 ✔ 다음으로 가요!";
          btn.remove();
        };
      };
    };
  }
  else if(act==="abc"){
    qs = PHONICS;
    show = () => {
      const [L, w, e] = qs[i]; prog.textContent = `${i+1} / ${qs.length}`;
      box.innerHTML = `<div class="ecard"><div class="eword" style="font-size:84px">${L} ${L.toLowerCase()}</div><div class="eemo">${e}</div><div class="emean" style="font-size:30px">${L==="X" ? `bo<b style="color:var(--main-d)">x</b>` : `<b style="color:var(--main-d)">${w[0]}</b>${w.slice(1)}`}</div>
        <div class="row" style="justify-content:center"><button class="btn spk" data-say="${L}">🔤 글자 이름</button>${spk(w)}${spk(w,true)}</div></div>
        <div class="row" style="justify-content:space-between;margin-top:16px"><button class="big gray" id="eprev" ${i?"":"disabled"}>◀ 앞</button><button class="big" id="enext">${i<qs.length-1 ? "다음 ▶" : "끝!"}</button></div>`;
      say(w);
      $("#eprev").onclick = () => { i--; show(); };
      $("#enext").onclick = () => { if(i < qs.length-1){ i++; show(); } else finish(0); };
    };
  }
  else if(act==="first"){
    qs = shuffle(PHONICS.filter(p => p[0]!=="X")).slice(0, 10);
    show = () => {
      const [L, w, e] = qs[i]; prog.textContent = `${i+1} / ${qs.length}`;
      const opts = shuffle([L, ...pickN(PHONICS.map(p => p[0]).filter(c => c!=="X"), 3, L)]);
      box.innerHTML = `<div class="ecard"><div class="eemo">${e}</div><div class="emean">잘 듣고, 어떤 글자로 시작할까?</div><div class="row" style="justify-content:center">${spk(w)}${spk(w,true)}</div></div>
        <div class="eopts four">${opts.map(o => `<button class="eopt big2" data-o="${o}">${o} ${o.toLowerCase()}</button>`).join("")}</div>`;
      say(w);
      box.querySelectorAll("[data-o]").forEach(b => b.onclick = () => {
        if(box.dataset.lock==="1") return; box.dataset.lock = "1"; setTimeout(() => box.dataset.lock = "", 900);
        const ok = b.dataset.o===L; b.classList.add(ok ? "ok" : "bad"); if(!ok) box.querySelector(`[data-o="${L}"]`).classList.add("ok");
        feedback(ok, `${w} → ${L}`); nextQ(ok, w);
      });
    };
  }
  else if(act==="vowel"){
    qs = shuffle(CVC).slice(0, 10);
    show = () => {
      const [w, v, e] = qs[i]; prog.textContent = `${i+1} / ${qs.length}`;
      const masked = w.replace(v, "_");
      box.innerHTML = `<div class="ecard"><div class="eemo">${e}</div><div class="eword" style="letter-spacing:6px">${masked}</div><div class="emean">가운데 들어갈 소리는?</div><div class="row" style="justify-content:center">${spk(w)}${spk(w,true)}</div></div>
        <div class="eopts five">${["a","e","i","o","u"].map(o => `<button class="eopt big2" data-o="${o}">${o}</button>`).join("")}</div>`;
      say(w);
      box.querySelectorAll("[data-o]").forEach(b => b.onclick = () => {
        if(box.dataset.lock==="1") return; box.dataset.lock = "1"; setTimeout(() => box.dataset.lock = "", 900);
        const ok = b.dataset.o===v; b.classList.add(ok ? "ok" : "bad"); if(!ok) box.querySelector(`[data-o="${v}"]`).classList.add("ok");
        box.querySelector(".eword").textContent = w; feedback(ok, w); nextQ(ok, w);
      });
    };
  }
  show();
}

// ───────── 녹음 + 듣고 판정 (아이패드 사파리·갤탭 크롬) ─────────
const normEn = s => String(s||"").toLowerCase().replace(/[’']/g,"'").replace(/[^a-z' ]/g," ").replace(/\s+/g," ").trim();
function judgeSpeech(it, heard){
  if(heard==null) return null;
  const h = " " + normEn(heard) + " ";
  if(it.t==="word") return h.includes(" " + normEn(it.s) + " ");
  if(it.t==="ans") return it.keys.some(k => h.includes(k.startsWith(" ") ? k : " " + k)) || it.keys.some(k => h.includes(k));
  const want = normEn(it.s).split(" "), got = new Set(normEn(heard).split(" "));
  return want.filter(w => got.has(w)).length / want.length >= 0.7;
}
// 녹음하면서 동시에 글자로 알아듣기. 둘 중 하나가 안 되면 되는 것만 해요.
function recordSpeech(maxMs=7000){
  let stopFn = null;
  const p = new Promise(async resolve => {
    let stream = null, mr = null, chunks = [], heard = null, done = false, recDone = false, srDone = false, mime = "";
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const finish = () => { if(done || !(recDone && srDone)) return; done = true; if(stream) stream.getTracks().forEach(t => t.stop());
      const blob = chunks.length ? new Blob(chunks, {type: mime || chunks[0].type || "audio/mp4"}) : null; resolve({blob, heard}); };
    try{
      stream = await navigator.mediaDevices.getUserMedia({audio:true});
      mime = ["audio/mp4","audio/webm;codecs=opus","audio/webm"].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || "";
      mr = new MediaRecorder(stream, mime ? {mimeType:mime, audioBitsPerSecond:24000} : undefined);
      mr.ondataavailable = e => e.data && e.data.size && chunks.push(e.data);
      mr.onstop = () => { recDone = true; finish(); };
      mr.start();
    }catch(e){ recDone = true; }
    let sr = null;
    if(SR){ try{
      sr = new SR(); sr.lang = "en-US"; sr.interimResults = false; sr.maxAlternatives = 3;
      sr.onresult = e => { heard = [...e.results[0]].map(a => a.transcript).join(" / "); };
      sr.onerror = () => {}; sr.onend = () => { srDone = true; if(mr && mr.state==="recording") setTimeout(() => { try{ mr.stop(); }catch(e){} }, 400); finish(); };
      sr.start();
    }catch(e){ sr = null; } }
    if(!sr) srDone = true;
    const stopAll = () => { try{ sr && sr.stop(); }catch(e){} if(mr && mr.state==="recording"){ try{ mr.stop(); }catch(e){} } else { recDone = true; } if(!sr){ srDone = true; } finish(); };
    stopFn = stopAll; setTimeout(stopAll, maxMs);
    if(!mr && !sr) resolve({blob:null, heard:null});
  });
  return {done:p, stop:() => stopFn && stopFn()};
}
const blobToURL = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });
async function saveVoice(meta, blob){
  if(!blob) return "";
  const data = await blobToURL(blob); if(data.length > 950000) return "";
  const id = "voice-" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  try{ await DB.saveRec(id, {type:"voice", at:Date.now(), ...meta, data}); return id; }catch(e){ return ""; }
}
async function playVoice(id, btn){
  if(btn) btn.textContent = "⏳";
  try{ const d = await DB.loadRec(id); if(!d || !d.data){ toast("녹음을 찾을 수 없어요"); return; } const a = new Audio(d.data); await a.play(); }
  catch(e){ toast("이 기기에서는 재생이 안 돼요"); }
  finally{ if(btn) btn.textContent = "▶ 듣기"; }
}

// 영역별 수준: 그 학년 문항을 절반 넘게 맞힌 가장 높은 학년 (아래 학년이 무너지면 거기서 멈춤)
function etestLevel(res){
  res = res.filter(r => r.ok!==null && r.ok!==undefined);
  if(!res.length) return 0;
  const by = {}; res.forEach(r => { const b = by[r.lv] = by[r.lv] || {ok:0, n:0}; b.n++; if(r.ok) b.ok++; });
  let lv = 2;
  for(const g of [3,4,5,6]){ const b = by[g]; if(!b || b.ok*2 <= b.n) break; lv = g; }
  return lv;
}
const etestLabel = lv => lv===0 ? "녹음 들어 보기" : lv<=2 ? "기초부터" : lv===6 ? "6학년 이상" : `${lv}학년 수준`;
function etestAdvice(L){
  const tips = [];
  if(L.ph <= 3) tips.push("파닉스(글자 소리)부터 다지면 좋아요");
  if(L.voc <= 3) tips.push("3~4학년 기본 단어 단원부터 시작해요");
  else if(L.voc === 4) tips.push("4학년 단어는 잘 알아요. 4~5학년 표현으로 넘어가도 돼요");
  else tips.push("단어 실력이 학년보다 높아요. 5~6학년 표현도 괜찮아요");
  if(L.lis < L.voc) tips.push("단어보다 듣기가 약해요. 듣기·따라 읽기를 많이 해요");
  if(L.dic < L.voc) tips.push("뜻은 알지만 철자가 약해요. 철자 맞추기·받아쓰기를 늘려요");
  if(L.sen < L.voc) tips.push("문장 순서 연습(문장 만들기)이 필요해요");
  if(L.spk && L.spk < L.voc) tips.push("아는 것보다 읽고 말하기가 약해요. 매일 따라 읽기를 꼭 해요");
  if(L.spk===0) tips.push("말하기는 앱이 판정을 못 했어요. 녹음을 직접 들어 봐 주세요");
  return tips;
}

function etestCopyText(r){
  const L = r.levels || {}, I = r.items || {}, lines = [];
  lines.push(`[수아 영어 실력 알아보기] ${fmtFull(r.at)} · 걸린 시간 ${fmtSec(r.dur||0)}`);
  lines.push("영역별 수준: " + ETEST.map(s => `${s.name} ${etestLabel(L[s.id] ?? 2)}`).join(" / "));
  ETEST.forEach(s => {
    const rs = I[s.id] || []; if(!rs.length) return;
    lines.push(`\n■ ${s.name} (${rs.length}문제 풂${rs.length < s.items.length ? `, ${s.items.length - rs.length}문제는 연달아 틀려서 멈춤` : ""})`);
    rs.forEach(x => lines.push(`- [${x.lv}학년] ${x.q} → ${x.ok===null ? "판정 없음" : x.ok ? "O" : "X"}${x.a ? ` (답: ${x.a})` : ""}`));
  });
  lines.push("\n추천: " + etestAdvice(L).join(" / "));
  return lines.join("\n");
}

    const tip = p.kind==="frac" ? (p.form==="improper" ? "가분수로 써요. " : p.form==="mixed" ? "대분수로 써요. 왼쪽 칸에 자연수를 써요. " : (p.simp ? "답은 기약분수로 써요. " : "") + "대분수면 왼쪽 칸에 자연수를 써요. ") : p.kind==="div" ? "나머지가 없으면 나머지 칸은 비워 둬요. " : p.kind==="set" ? "답이 여러 개면 쉼표(,)로 나눠 써요. " : p.kind==="cmp" ? "알맞은 기호를 눌러요. " : p.kind==="ratio" ? "가장 작은 자연수로 써요. " : "";
    $("#anote").textContent = att===2 && ed ? `1번째 답 ${s.a1} 은(는) 틀렸어요. 다시 천천히 풀어 봐요!` : (has(s["a"+att]) ? "답을 적었어요. 고치고 싶으면 다시 써서 답 확인을 눌러요." : tip);
    renderSide();
    const key = recKey(id, i, ed ? att : 1);
    curKey = null; board.readonly = true; board.load(null);
    const rec = await loadRec(key);
    if(tok!==loadTok) return;

    board.readonly = !ed; curKey = ed ? key : null;
  }

  async function checkCur(){
    const r = readAns(hw.problems[cur]); if(r.err){ toast(r.err); return; }
    const v = r.v, i = cur, att = curAtt(hw);
    await flush();
    try{ await DB.updateHW(id, {[`st.${i}.a${att}`]: v, lastAt: Date.now()}); }catch(e){ toast("저장 실패: 인터넷을 확인해 주세요"); return; }
    toast("답을 적었어요 ✔");
    setTimeout(() => {
      if(cur!==i) return;
      const next = hw.problems.findIndex((p,j) => j!==i && editable(hw,j) && !has(stOf(hw,j)["a"+att]));
      if(next>=0) openProb(next);
    }, 500);
  }

  let submitting = false;
  async function submit(auto=false){
    const r2 = hw.round===2;
    if(submitting) return;
    if(hw.test && auto!==true){
      const left = hw.problems.filter((p,i) => !has(stOf(hw,i).a1)).length;
      if(!await ask("시험을 제출할까요?", (left ? `아직 안 푼 문제가 <b>${left}개</b> 있어요.<br>` : "") + "제출하면 고칠 수 없어요.", "제출하기", "더 볼래요")) return;
    } else if(!hw.test && !await ask(r2 ? "마지막으로 제출할까요?" : "제출할까요?", r2 ? "이번이 마지막 기회예요." : "틀린 문제가 있으면 한 번 더 풀 수 있어요.", "제출하기", "더 볼래요")) return;
    submitting = true;
    await flush();
    const att = curAtt(hw), patch = {}; let wrong = 0;
    hw.problems.forEach((p,i) => { if(!editable(hw,i)) return; const ok = has(p.ans) ? checkAns(stOf(hw,i)["a"+att], p.ans, p.kind, p.simp, p.form) : null; patch[`st.${i}.ok${att}`] = ok; if(ok===false) wrong++; });
    if(att===1 && wrong>0 && !hw.test){ patch.status = "round2"; patch.round = 2; }
    else { patch.status = "submitted"; patch.submittedAt = Date.now(); }
    try{ await DB.updateHW(id, patch); }catch(e){ submitting = false; toast("제출 실패: 인터넷을 확인해 주세요"); return; }
    if(hw.test){
      confetti();
      await tell(auto===true ? "시간이 끝났어요! ⏰" : "시험 끝! 🎉", "수고했어요! 쓴 답은 다 제출됐어요.<br>끝낸 시험에서 결과를 볼 수 있어요.");
      await plannerNudge();
      go(studentHome); return;
    }
    submitting = false;
    if(patch.status==="round2"){
      await tell("한 번 더 풀어 봐요! 💪", `틀린 문제가 <b>${wrong}개</b> 있어요.<br>빨간 느낌표(!) 문제를 다시 풀어요. 이번이 마지막 기회예요.`, "다시 풀기");
      cur = -1; const first = hw.problems.findIndex((p,i) => editable(hw,i)); if(first>=0) openProb(first);
    } else {
      confetti();
      await tell("제출 완료! 🎉", "수고했어요! 선생님이 채점하면 끝낸 숙제에서 볼 수 있어요.");
      await plannerNudge();
      go(studentHome);
    }
  }

  unsubs.push(DB.watchHW(id, h => {
    if(!h){ go(studentHome); return; }
    const roundChanged = hw && hw.round!==h.round;
    hw = h;
    if(h.status==="submitted" || h.status==="graded"){ if(!built) go(studentResult, id); return; }
    if(!built){ build(); renderSide(); const first = h.problems.findIndex((p,i) => editable(h,i) && !has(stOf(h,i)["a"+curAtt(h)])); openProb(first>=0 ? first : 0); }
    else if(!roundChanged) renderSide();
  }));
}

// ───────── 답 칸 (단원마다 다르게) ─────────
const inp = (id, v, cls="inp sm", mode="numeric", ph="") => `<input class="${cls}" id="${id}" inputmode="${mode}" autocomplete="off"${ph ? ` placeholder="${ph}"` : ""} value="${esc(v ?? "")}">`;
const fracBox = (pre, w, n, d, whole=true) => `${whole ? inp(pre+"w", w) : ""}<span class="fin">${inp(pre+"n", n)}<span class="fl"></span>${inp(pre+"d", d)}</span>`;
function ansUI(p, val){
  const box = $("#ansin"), kind = p.kind; val = val || "";
  if(kind==="frac"){
    const m = /^(?:(\d+)(?:\s+|$))?(?:(\d+)\/(\d+))?$/.exec(val) || [];
    box.innerHTML = fracBox("a", m[1], m[2], m[3], p.form!=="improper");
  } else if(kind==="div" || kind==="divd"){
    const m = val.split("…");
    const mode = kind==="divd" ? "decimal" : "numeric";
    box.innerHTML = `<span class="lab2">몫</span>${inp("aq", m[0], "inp sm", mode)}<span class="lab2">나머지</span>${inp("ar", m[1], "inp sm", mode)}`;
  } else if(kind==="cmp"){
    box.innerHTML = [">","=","<"].map(c => `<button class="btn cmpb${val===c?" on":""}" data-cmp="${esc(c)}" style="font-size:26px;min-width:64px;font-family:Pretendard,sans-serif">${esc(c)}</button>`).join("");
    box.querySelectorAll("[data-cmp]").forEach(b => b.onclick = () => box.querySelectorAll("[data-cmp]").forEach(x => x.classList.toggle("on", x===b)));
  } else if(kind==="ratio"){
    const k = String(p.ans).split(":").length, m = val.split(":").map(x => x.trim());
    box.innerHTML = Array.from({length:k}, (_,i) => inp("ar"+i, m[i])).join(`<span class="lab2" style="font-size:24px">:</span>`);
  } else if(kind==="frac2"){
    const m = val.split(",").map(x => (/(\d+)\/(\d+)/.exec(x)||[]));
    box.innerHTML = fracBox("f0", "", m[0]?.[1], m[0]?.[2], false) + `<span class="lab2" style="font-size:24px">,</span>` + fracBox("f1", "", m[1]?.[1], m[1]?.[2], false);
  } else if(kind==="pct"){
    box.innerHTML = inp("ans", val.replace("%",""), "inp", "decimal", "답을 써요") + `<span class="lab2" style="font-size:22px">%</span>`;
  } else if(kind==="set"){
    box.innerHTML = inp("ans", val, "inp", "text", "예: 1, 2, 3");
  } else if(kind==="text"){
    box.innerHTML = inp("ans", val, "inp", "text", "예: 3할 2푼 5리");
  } else {
    box.innerHTML = inp("ans", val, "inp", kind ? "decimal" : "text", "답을 써요");
  }
}
function readAns(p){
  const kind = p.kind, g = id => ($("#"+id)?.value || "").trim();
  if(kind==="frac"){
    const w = g("aw"), n = g("an"), d = g("ad");
    if((n && !d) || (!n && d)) return {err:"분자와 분모를 둘 다 써 주세요"};
    if(!w && !n) return {err:"답을 먼저 써 주세요"};
    return {v:[w, n ? `${n}/${d}` : ""].filter(Boolean).join(" ")};
  }
  if(kind==="div" || kind==="divd"){
    const q = g("aq"), r = g("ar");
    if(!q) return {err:"몫을 먼저 써 주세요"};
    if(kind==="divd") return r ? {v:`${q}…${r}`} : {err:"나머지도 써 주세요"};
    return {v: r && +r ? `${q}…${r}` : q};
  }
  if(kind==="cmp"){ const b = $("#ansin [data-cmp].on"); return b ? {v:b.dataset.cmp} : {err:">, =, < 중에서 골라 주세요"}; }
  if(kind==="ratio"){
    const k = String(p.ans).split(":").length, v = Array.from({length:k}, (_,i) => g("ar"+i));
    return v.every(Boolean) ? {v:v.join(" : ")} : {err:"칸을 모두 채워 주세요"};
  }
  if(kind==="frac2"){
    const v = [0,1].map(i => [g(`f${i}n`), g(`f${i}d`)]);
    return v.every(([n,d]) => n && d) ? {v:v.map(([n,d]) => `${n}/${d}`).join(", ")} : {err:"두 분수의 분자, 분모를 모두 써 주세요"};
  }
  const v = g("ans"); if(!v) return {err:"답을 먼저 써 주세요"};
  if(kind==="pct") return {v:v.replace(/%/g,"")+"%"};
  return {v};
}

async function shrink(file, max, q){
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*sc); c.height = Math.round(img.naturalHeight*sc);
  const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
  let d = c.toDataURL("image/jpeg", q); while(d.length > 900000 && q > 0.3){ q -= 0.1; d = c.toDataURL("image/jpeg", q); }
  return d;
}

function confetti(){
  const em = ["🎉","⭐","💖","🌸","✨"];
  for(let i=0;i<36;i++){
    const d = document.createElement("div"); d.className = "confetti"; d.textContent = em[i%em.length];
    d.style.left = Math.random()*100 + "vw"; d.style.animationDelay = (Math.random()*.6) + "s"; d.style.fontSize = (18+Math.random()*16) + "px";
    document.body.appendChild(d); setTimeout(() => d.remove(), 2600);
  }
}

// ───────── 녹화 보기 ─────────
async function openPlayer(title, key, guideQ=""){
  const rec = await loadRec(key);
  if(!rec || !rec.ev.length){ tell("녹화가 없어요", "이 풀이에는 쓴 내용이 없어요."); return; }
  const m = modal(`<div class="bar" style="margin-bottom:6px"><h3 style="margin:0">${title}</h3><button class="link" data-x>닫기 ✕</button></div>
    <div class="boardwrap" data-bw></div>
    <div class="pctl">
      <button class="btn" data-play style="min-width:64px">▶ 재생</button>
      <input type="range" min="0" max="1000" value="0" data-rg>
      <span class="tm" data-tm></span>
    </div>
    <div class="pctl">
      <span class="muted">빠르기</span>
      <button class="btn" data-sp="1">1배</button><button class="btn on" data-sp="2">2배</button><button class="btn" data-sp="4">4배</button>
      <label class="muted" style="display:flex;align-items:center;gap:4px;margin-left:auto"><input type="checkbox" data-skip checked>멈춘 시간 건너뛰기</label>
    </div>
    <div class="muted" data-info style="margin-top:6px"></div>`, true);
  const b = new Board(m.querySelector("[data-bw]"), true); applyGuide(b.cv, rec.guide ? guideQ : "");
  let R = compress(rec), T = 0, speed = 2, playing = false, last = 0, raf = 0;
  const info = () => { m.querySelector("[data-info]").textContent = `실제로 푼 시간 ${fmtSec(rec.dur)} · 획 ${rec.ev.filter(e=>e.k==="s").length}개${rec.guide ? " · 📐 자리 칸 꺼내서 풀었어요" : ""}`; };
  const draw = () => { renderAt(b.ctx, R.ev, T); m.querySelector("[data-tm]").textContent = `${fmtSec(T)} / ${fmtSec(R.dur)}`; m.querySelector("[data-rg]").value = R.dur ? Math.round(T/R.dur*1000) : 0; };
  b.redraw = () => draw();
  const tick = now => { if(!playing) return; T += (now-last)*speed; last = now; if(T >= R.dur){ T = R.dur; playing = false; m.querySelector("[data-play]").textContent = "▶ 재생"; } draw(); if(playing) raf = requestAnimationFrame(tick); };
  const play = () => { if(T >= R.dur) T = 0; playing = true; last = performance.now(); m.querySelector("[data-play]").textContent = "⏸ 멈춤"; raf = requestAnimationFrame(tick); };
  const stop = () => { playing = false; cancelAnimationFrame(raf); m.querySelector("[data-play]").textContent = "▶ 재생"; };
  m.querySelector("[data-play]").onclick = () => playing ? stop() : play();
  m.querySelector("[data-rg]").oninput = e => { stop(); T = e.target.value/1000*R.dur; draw(); };
  m.querySelectorAll("[data-sp]").forEach(x => x.onclick = () => { speed = +x.dataset.sp; m.querySelectorAll("[data-sp]").forEach(y => y.classList.toggle("on", y===x)); });
  m.querySelector("[data-skip]").onchange = e => { const r = T/(R.dur||1); R = e.target.checked ? compress(rec) : {ev:rec.ev, dur:rec.dur+300}; T = r*R.dur; draw(); };
  m.querySelector("[data-x]").onclick = () => { stop(); b.destroy(); m.remove(); };
  info(); draw(); play();
}

    document.querySelectorAll("[data-ed]").forEach(b => b.classList.toggle("on", ecfg.eDays.includes(+b.dataset.ed)));
    let t = "";

      const x = ecfg.eSeq[curList.filter(h => h.auto && hwKind(h)==="eng").length % ecfg.eSeq.length];

  };

    else if(b.id==="esave"){
      ecfg.eOn = $("#eon").checked;
      DB.getConfig().then(c => DB.setConfig({...(c||{on:false, stages:[], count:10, days:[1,2,3,4,5]}), eOn:ecfg.eOn, eSeq:ecfg.eSeq, eDays:ecfg.eDays}))
        .then(() => { cfg.eOn = ecfg.eOn; cfg.eSeq = ecfg.eSeq; cfg.eDays = ecfg.eDays; toast("영어 자동 과제를 저장했어요"); ensureAutoEng(curList, true); paintE(); })

    else if(!cfg.days.length) t = "요일을 하나 이상 골라 주세요.";
    else {
      let d = new Date(); const todayDone = curList.some(h => h.id==="auto-"+dayKey(d));
      if(todayDone || !cfg.days.includes(d.getDay())){ for(let k=0;k<7;k++){ d = new Date(d.getTime()+864e5); if(cfg.days.includes(d.getDay())) break; } }
      const sid = cfg.stages[curList.filter(h => h.auto).length % cfg.stages.length];

    catch(e){ toast("저장 실패: 인터넷을 확인해 주세요"); }
  };
  const paintTL = () => document.querySelectorAll("[data-tl]").forEach(b => b.classList.toggle("on", +b.dataset.tl===(cfg.limit||0)));
  DB.getConfig().then(c => { if(c) cfg = {...cfg, ...c}; paint(); paintTL(); }).catch(() => { paint(); paintTL(); });
  $("#tl").onclick = e => {
    const b = e.target.closest("[data-tl]"); if(!b) return;
    const limit = +b.dataset.tl;
    DB.getConfig().then(c => DB.setConfig({...(c||{on:false, stages:[], count:10, days:[1,2,3,4,5]}), limit}))
      .then(() => { cfg.limit = limit; paintTL(); toast(limit ? `하루 ${limit}분으로 정했어요` : "시간 제한을 껐어요"); })
      .catch(() => toast("저장 실패: 인터넷을 확인해 주세요"));
  };
  $("#auto").onclick = e => {
    const b = e.target.closest("button"); if(!b) return;
    if(b.dataset.g) return;
    if(b.id==="aadd"){ const sid = pickAuto(); if(cfg.stages.includes(sid)) return toast("이미 들어 있어요"); cfg.stages.push(sid); toast("넣었어요. 저장을 눌러야 적용돼요"); }
    else if(b.dataset.rm) cfg.stages.splice(+b.dataset.rm, 1);
    else if(b.dataset.up){ const k = +b.dataset.up; [cfg.stages[k-1], cfg.stages[k]] = [cfg.stages[k], cfg.stages[k-1]]; }
    else if(b.dataset.ac) cfg.count = +b.dataset.ac;
    else if(b.dataset.ad){ const d = +b.dataset.ad, k = cfg.days.indexOf(d); k>=0 ? cfg.days.splice(k,1) : cfg.days.push(d); }
    else if(b.id==="asave"){
      DB.getConfig().then(c => DB.setConfig({...cfg, on:$("#aon").checked, limit:cfg.limit||0, ppin:(c&&c.ppin)||cfg.ppin||""})).then(() => { cfg.on = $("#aon").checked; toast("자동 숙제를 저장했어요"); ensureAuto(curList, true); paint(); }).catch(() => toast("저장 실패: 인터넷을 확인해 주세요"));
      return;
    }

      const [lab,cls] = statusOf(h), n = h.problems.length;
      if(hwKind(h)==="eng"){ const done = ["submitted","graded"].includes(h.status);
        return `<button class="hw" data-id="${h.id}" data-k="eng"><div class="grow"><div class="ti">${h.auto?"🤖 ":""}🔤 ${esc(h.title)}</div><div class="muted">${fmtD(h.createdAt)} · ${engPairName(h.unit, h.act)}${done ? ` · ${engHWScore(h)}` : ""}</div></div><span class="chip ${done?"sub":"new"}">${done ? "제출 완료" : "안 함"}</span></button>`; }
      let sc = "";
      if(h.status==="graded") sc = `최종 ${h.problems.filter((_,i)=>gradeOk(h,i)===true).length}/${n}`;
      else if(h.status==="submitted") sc = `1번째 ${h.problems.filter((_,i)=>stOf(h,i).ok1===true).length}/${n} → 최종 ${h.problems.filter((_,i)=>finalOk(h,i)===true).length}/${n}`;
      else sc = `답 ${h.problems.filter((_,i)=>attempts(h,i)>0).length}/${n}`;
      return `<button class="hw" data-id="${h.id}"><div class="grow"><div class="ti">${h.auto?"🤖 ":""}${h.test?"📝 ":""}${esc(h.title)}</div><div class="muted">${fmtD(h.createdAt)}${h.stage?` · ${STAGE[h.stage]?STAGE[h.stage].name:""}`:""} · ${sc}${h.st && h.st.tm ? ` · ⏱ ${fmtSec(h.st.tm)}` : ""}${evSum(h).o ? ` · 🚪${evSum(h).o}` : ""}${evSum(h).d ? ` · 💤${evSum(h).d}` : ""}</div></div><span class="chip ${cls}">${lab}</span></button>`;
    }).join("") : `<div class="empty">아직 낸 숙제가 없어요.</div>`;
  }));
  app.onclick = e => {
    const b = e.target.closest(".hw[data-id]"); if(!b) return;
    if(b.dataset.k!=="eng") return go(teacherGrade, b.dataset.id);
    const h = curList.find(x => x.id===b.dataset.id); if(!h) return;
    const r = h.st && h.st.r;
    const m = modal(`<h3>🔤 ${esc(h.title)}</h3><div style="font-size:17px">${engPairName(h.unit, h.act)}</div>
      <div class="muted" style="margin:6px 0">낸 날 ${fmtFull(h.createdAt)}${h.submittedAt ? `<br>제출 ${fmtFull(h.submittedAt)}` : ""}</div>
      ${r ? `<div style="font-size:18px">${r.total ? `점수 <b>${r.score}/${r.total}</b>` : "끝까지 다 봤어요"} · ${fmtSec(r.dur||0)}</div>${(r.wrong||[]).length ? `<div class="muted">틀린 것: ${r.wrong.map(esc).join(", ")}</div>` : ""}` : `<div class="muted">아직 안 했어요.</div>`}
      <div class="mbtns"><button class="big gray" data-del style="color:var(--bad)">과제 지우기</button><button class="big" data-x>닫기</button></div>`);
    m.onclick = async ev => {
      if(ev.target.closest("[data-x]")) return m.remove();
      if(ev.target.closest("[data-del]")){ m.remove(); if(await ask("이 과제를 지울까요?", "지우면 되돌릴 수 없어요.", "지우기", "취소")){ try{ await DB.deleteHW(h.id); toast("지웠어요"); }catch(e){ toast("지우기 실패"); } } }
    };
  };
}

// ───────── 선생님: 숙제 만들기 ─────────
function teacherCreate(mode){
  const T = mode==="test";
  app.onclick = null;
  app.innerHTML = `<div class="page"><div class="bar"><button class="link" id="back">← 목록</button></div>
    <div class="card" id="memoCard" style="display:none;background:var(--yel)"><h2>📌 지난 숙제 메모 (나만 보기)</h2><div id="lastMemo" style="white-space:pre-wrap"></div></div>

      <div class="muted" style="margin-top:6px">시험은 다시 풀기 없이 한 번만 풀고, 제출할 때까지 정답이 안 보여요. 시간이 끝나면 자동으로 제출돼요.</div>` : ""}</div>
    <div class="card"><h2>단원 골라서 문제 넣기</h2>
      <div class="row">
        <div id="stage" style="flex:1 1 100%"></div>
        <span class="muted">문제 수</span><select class="inp" id="cnt" style="max-width:110px">${[5,10,15,20].map(n=>`<option ${n===10?"selected":""}>${n}</option>`).join("")}</select>
      </div>
      <button class="big gray" id="gen" style="margin-top:10px">문제 넣기</button>
      <div class="muted" style="margin-top:8px">쉬운 문제 → 어려운 문제 순서로 들어가요.</div>
    </div>
    <div class="card"><h2>문제 목록 <span class="muted" id="pc"></span></h2>
      <div class="muted" style="margin-bottom:8px">정답 칸을 비워 두면 자동 채점 없이 선생님이 직접 채점해요.</div>
      <div id="rows"></div>
      <div class="row" style="margin-top:8px"><button class="btn" id="add">+ 직접 문제 추가</button><button class="btn" id="clr">모두 지우기</button></div>
    </div>
    <button class="big" id="send">${T ? "시험 내기" : "숙제 내기"}</button></div>`;
  $("#back").onclick = () => go(teacherHome);
  const pickStage = stagePicker($("#stage"), "c41_1_1");
  const rows = $("#rows");
  const addRow = (q="", a="", ext={}) => { const d = document.createElement("div"); d.className = "prow"; d.dataset.ext = JSON.stringify(ext); d.innerHTML = `<span class="n"></span><input class="inp" data-q placeholder="문제" value="${esc(q)}"><input class="inp" data-a placeholder="정답" value="${esc(a)}"><button class="btn" data-del>✕</button>`; rows.appendChild(d); renum(); };
  const renum = () => { [...rows.children].forEach((r,i) => r.querySelector(".n").textContent = i+1); $("#pc").textContent = `(${rows.children.length}문제)`; };
  rows.onclick = e => { if(e.target.closest("[data-del]")){ e.target.closest(".prow").remove(); renum(); } };
  $("#gen").onclick = () => { makeProblems(pickStage(), +$("#cnt").value).forEach(({q, ans, ...ext}) => addRow(q, ans, ext)); };
  $("#add").onclick = () => { addRow(); rows.lastChild.querySelector("[data-q]").focus(); };
  $("#clr").onclick = async () => { if(rows.children.length && await ask("모두 지울까요?", "문제 목록이 비워져요.", "지우기", "취소")){ rows.innerHTML = ""; renum(); } };

    const g = list.find(h => h.status==="graded");
