<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{
  --bg:#fff8ee; --card:#fff; --ink:#3a2f2a; --sub:#8a7b70; --main:#ff8a5b; --main-d:#e8693a;
  --ok:#2f9e63; --bad:#e5484d; --soft:#ffe9d9; --line:#f0dccb; --blue:#4c8bf5; --blue-d:#3266c4;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.jua,h1,h2,h3{font-family:"Jua",sans-serif;font-weight:400}
.hide{display:none!important}
.page{max-width:760px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.bar h1{font-size:26px;margin:0}
.link{border:0;background:none;color:var(--sub);cursor:pointer;padding:8px;font-size:15px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 2px 0 var(--line);margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:20px}
.big{display:block;width:100%;border:0;border-radius:16px;padding:14px;font-family:"Jua";font-size:22px;background:var(--main);color:#fff;cursor:pointer;box-shadow:0 4px 0 var(--main-d)}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 var(--main-d)}
.big.gray{background:#efe4da;color:var(--ink);box-shadow:0 4px 0 #d9c8b9}
.big.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.big:disabled{opacity:.45;cursor:default}
.btn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;cursor:pointer;font-size:15px}
.btn.on{border-color:var(--main);background:var(--main);color:#fff}
.btn.ok.on{border-color:var(--ok);background:var(--ok)}
.btn.bad.on{border-color:var(--bad);background:var(--bad)}
.btn:disabled{opacity:.4;cursor:default}
.inp{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-size:16px}
.inp:focus{outline:none;border-color:var(--main)}
textarea.inp{min-height:80px;resize:vertical}
.chip{display:inline-block;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:700;background:var(--soft);color:var(--main-d);white-space:nowrap}
.chip.new{background:#ffe2e2;color:var(--bad)}
.chip.ing{background:#fff3c4;color:#9a6b00}
.chip.r2{background:#ffe2e2;color:var(--bad)}
.chip.sub{background:#e3edff;color:var(--blue-d)}
.chip.done{background:#dff5e8;color:var(--ok)}
.muted{color:var(--sub);font-size:14px}
.empty{color:var(--sub);font-size:14px;padding:6px 0}
.demo{background:#fff3c4;border-radius:12px;padding:10px 14px;font-size:14px;margin:0 auto 12px;max-width:760px}
.center{max-width:420px;margin:8vh auto 0;display:grid;gap:14px;text-align:center;padding:0 16px}
.center h1{font-size:38px;margin:0}
.hwlist{display:grid;gap:10px}
.hw{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 0 var(--line);cursor:pointer}
.hw .ti{font-family:"Jua";font-size:20px}
.hw .grow{flex:1;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99;max-width:90vw;text-align:center}
.toast.show{opacity:1}

/* 문제 풀기 화면 */
.solve{position:fixed;inset:0;display:grid;grid-template-columns:260px 1fr;background:var(--bg)}
.plist{display:flex;flex-direction:column;border-right:2px solid var(--line);background:#fffdf9;padding:calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));min-height:0}
.plist .ph{display:flex;align-items:center;justify-content:space-between}
.plist .ph .jua{font-size:19px}
.rinfo{font-size:13px;border-radius:10px;padding:6px 10px;margin:6px 0 8px;background:var(--soft)}
.rinfo.r2{background:#ffe2e2;color:var(--bad);font-weight:700}
.items{flex:1;overflow-y:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:6px;align-content:start;padding:2px}
.it{width:100%;min-width:0;display:flex;align-items:center;gap:8px;border:2px solid transparent;background:#fff;border-radius:12px;padding:10px;cursor:pointer;text-align:left;box-shadow:0 1px 0 var(--line)}
.it.cur{border-color:var(--main);background:var(--soft)}
.it .n{font-family:"Jua";width:28px;height:28px;border-radius:50%;background:#f3e6da;display:flex;align-items:center;justify-content:center;flex:none}
.it.cur .n{background:var(--main);color:#fff}
.it .q{flex:1;min-width:0;font-family:"Jua";font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .s{font-size:12px;text-align:right;white-space:nowrap}
.it .s b{display:block;font-size:18px}
.it.locked{opacity:.6}
.plist .big{margin-top:8px}
.pmain{display:flex;flex-direction:column;min-height:0;min-width:0;padding:calc(10px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom))}
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.phead .no{font-family:"Jua";font-size:22px}
.pq{font-family:"Jua";font-size:34px;margin:6px 0 8px;word-break:keep-all}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tool{border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 10px;cursor:pointer;font-size:15px;display:flex;align-items:center;gap:6px}
.tool.on{border-color:var(--ink)}
.dot{width:16px;height:16px;border-radius:50%;display:inline-block}
.boardwrap{flex:1;min-height:200px;display:flex;align-items:flex-start;justify-content:center;overflow:hidden}
.boardwrap canvas{background-color:#fff;background-image:linear-gradient(#eef3fb 1px,transparent 1px),linear-gradient(90deg,#eef3fb 1px,transparent 1px);background-size:28px 28px;border-radius:14px;box-shadow:0 0 0 2px var(--line);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;display:block}
.ansrow{display:flex;gap:8px;align-items:center;margin-top:10px}
.ansrow .lab{font-family:"Jua";font-size:22px}
.ansrow .inp{font-family:"Jua";font-size:24px;max-width:220px}
.ansrow .big{width:auto;padding:10px 18px;font-size:20px}
.anote{font-size:14px;margin-top:6px;min-height:20px}
.lockmsg{font-family:"Jua";font-size:20px;color:var(--ok);margin-bottom:6px}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(90px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:26px;box-shadow:0 4px 12px rgba(0,0,0,.2);cursor:pointer;z-index:20}
.fab .nd{position:absolute;top:4px;right:4px;width:14px;height:14px;border-radius:50%;background:var(--bad);border:2px solid #fff}
@media (max-width:700px){
  .solve{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .plist{border-right:0;border-bottom:2px solid var(--line)}
  .items{display:flex;overflow-x:auto;overflow-y:hidden}
  .it{flex:none}
  .it .q{display:none}
  .pq{font-size:26px}
}

/* 채팅 */
.chat{display:flex;flex-direction:column;gap:8px}
.msgs{max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px}
.msg{max-width:80%;align-self:flex-start}
.msg.me{align-self:flex-end;text-align:right}
.msg .who{font-size:12px;color:var(--sub)}
.msg .bub{display:inline-block;background:#f3e6da;border-radius:14px;padding:8px 12px;white-space:pre-wrap;word-break:break-word;text-align:left}
.msg.me .bub{background:var(--blue);color:#fff}
.msg .when{font-size:11px;color:var(--sub)}
.cin{display:flex;gap:8px}
.cin .big{width:auto;padding:10px 16px;font-size:18px;white-space:nowrap;flex:none}

/* 창 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.mbox{background:#fff;border-radius:20px;padding:18px;width:100%;max-width:420px;max-height:92vh;overflow:auto}
.mbox.wide{max-width:900px;display:flex;flex-direction:column;height:88vh}
.mbox h3{margin:0 0 8px;font-size:22px}
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.mbtns.one{grid-template-columns:1fr}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,92vw);background:#fff;box-shadow:-4px 0 16px rgba(0,0,0,.15);z-index:40;padding:calc(14px + env(safe-area-inset-top)) 14px 14px;display:flex;flex-direction:column}
.drawer .msgs{max-height:none;flex:1}
.drawer .chat{flex:1;min-height:0}
.pctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.pctl input[type=range]{flex:1;min-width:140px}
.pctl .tm{font-family:"Jua";min-width:90px;text-align:center}

/* 채점 */
.gq{border-top:1px dashed var(--line);padding:12px 0}
.gq:first-of-type{border-top:0}
.gq .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gq .no{font-family:"Jua";font-size:20px}
.gq .qq{font-family:"Jua";font-size:22px}
.att{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:15px}
.att .lb{color:var(--sub);width:72px}
.okc{color:var(--ok);font-weight:700}
.badc{color:var(--bad);font-weight:700}
.prow{display:grid;grid-template-columns:28px 1fr 120px 36px;gap:6px;align-items:center;margin-bottom:6px}
.prow .n{font-family:"Jua";text-align:center}
.sum{font-family:"Jua";font-size:20px}
.mix{display:inline-flex;align-items:center;gap:2px;vertical-align:middle}
.fr{display:inline-flex;flex-direction:column;align-items:center;font-size:.62em;line-height:1.08;margin:0 3px}
.fr span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.inp.sm{width:72px;text-align:center;font-family:"Jua";font-size:24px;padding:6px}
.fin{display:inline-flex;flex-direction:column;gap:3px}
.fin .fl{height:3px;background:var(--ink);border-radius:2px}
.lab2{font-family:"Jua";font-size:18px}
.ugrp{margin:8px 0}
.ugrp .row{margin-top:4px}
.banner{background:#e3edff;color:var(--blue-d);border-radius:12px;padding:10px 12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
</style>
</head>
<body>
<div id="demo" class="demo hide"></div>
<div id="app"></div>
<div id="layer"></div>
<div class="toast" id="toast"></div>

<script type="module">
// ══════════════════════════════════════════════
//  ▼ 설정: 안내서대로 여기만 바꾸면 돼요 ▼
// ══════════════════════════════════════════════
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD7-TkPSv5HUtgslq_j6GJjSb_JWQNBqDY",
  authDomain: "sua-homework.firebaseapp.com",
  projectId: "sua-homework",
  storageBucket: "sua-homework.firebasestorage.app",
  messagingSenderId: "1025059237296",
  appId: "1:1025059237296:web:6f927fbda4bcbd7b117a75",
  measurementId: "G-34G86QKZ2C"
};          // 파이어베이스에서 복사한 설정을 여기에 붙여 넣기
const TEACHER_EMAIL = "zico1756@naver.com";              // 선생님 로그인 이메일
const STUDENT = "수아";                 // 학생 이름
// ══════════════════════════════════════════════

const $ = (s, r=document) => r.querySelector(s);
const app = $("#app"), layer = $("#layer");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const days = "일월화수목금토";
const fmtD = ms => { const d=new Date(ms); return `${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`; };
const fmtDT = ms => { const d=new Date(ms); return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")}`; };
const fmtSec = ms => { const s=Math.round(ms/1000), m=Math.floor(s/60); return m ? `${m}분 ${s%60}초` : `${s%60}초`; };
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200); }

// ───────── 저장소 (파이어베이스 / 체험 모드) ─────────
let DB;
async function makeFirebase(){
  const B = "https://www.gstatic.com/firebasejs/10.12.2/";
  const [{initializeApp}, A, F] = await Promise.all([import(B+"firebase-app.js"), import(B+"firebase-auth.js"), import(B+"firebase-firestore.js")]);
  const fb = initializeApp(FIREBASE_CONFIG), auth = A.getAuth(fb), fs = F.getFirestore(fb);
  const T = TEACHER_EMAIL.trim().toLowerCase();
  return {
    mode:"firebase",
    onAuth(cb){ return A.onAuthStateChanged(auth, u => cb(!u ? null : u.isAnonymous ? "student" : (u.email||"").toLowerCase()===T ? "teacher" : null)); },
    loginTeacher:(e,p) => A.signInWithEmailAndPassword(auth, e, p),
    enterStudent:() => A.signInAnonymously(auth),
    logout:() => A.signOut(auth),
    watchHWList(cb){ return F.onSnapshot(F.query(F.collection(fs,"hw"), F.orderBy("createdAt","desc")), s => cb(s.docs.map(d => ({id:d.id, ...d.data()}))), e => toast("불러오기 실패: 인터넷을 확인해 주세요")); },
    watchHW(id, cb){ return F.onSnapshot(F.doc(fs,"hw",id), d => cb(d.exists() ? {id:d.id, ...d.data()} : null)); },
    async createHW(o){ return (await F.addDoc(F.collection(fs,"hw"), o)).id; },
    updateHW:(id,p) => F.updateDoc(F.doc(fs,"hw",id), p),
    deleteHW:id => F.deleteDoc(F.doc(fs,"hw",id)),
    saveRec:(k,o) => F.setDoc(F.doc(fs,"rec",k), o),
    async loadRec(k){ const d = await F.getDoc(F.doc(fs,"rec",k)); return d.exists() ? d.data() : null; },
    watchMsgs(id, cb){ return F.onSnapshot(F.query(F.collection(fs,"hw",id,"msgs"), F.orderBy("at")), s => cb(s.docs.map(d => d.data()))); },
    addMsg:(id,m) => F.addDoc(F.collection(fs,"hw",id,"msgs"), m),
    async getNote(id){ const d = await F.getDoc(F.doc(fs,"notes",id)); return d.exists() ? d.data().text : ""; },
    setNote:(id,t) => F.setDoc(F.doc(fs,"notes",id), {text:t}),
    async getConfig(){ const d = await F.getDoc(F.doc(fs,"config","auto")); return d.exists() ? d.data() : null; },
    setConfig:o => F.setDoc(F.doc(fs,"config","auto"), o),
    createHWId:(id,o) => F.setDoc(F.doc(fs,"hw",id), o),
  };
}
function makeLocal(){
  const K = "sua-hw-demo", blank = () => ({hw:{}, rec:{}, msgs:{}, notes:{}});
  const load = () => { try{ return JSON.parse(localStorage.getItem(K)) || blank(); }catch(e){ return blank(); } };
  let D = load(); const subs = new Set();
  const emit = () => subs.forEach(f => f());
  const save = (quiet) => { try{ localStorage.setItem(K, JSON.stringify(D)); }catch(e){ toast("저장 공간이 부족해요"); } if(!quiet) emit(); };
  window.addEventListener("storage", e => { if(e.key===K){ D = load(); emit(); } });
  const sub = f => { subs.add(f); Promise.resolve().then(() => subs.has(f) && f()); return () => subs.delete(f); };
  const clone = o => JSON.parse(JSON.stringify(o));
  const setPath = (o, path, v) => { const ks = path.split("."); let c = o; for(let i=0;i<ks.length-1;i++){ if(!c[ks[i]] || typeof c[ks[i]]!=="object") c[ks[i]] = {}; c = c[ks[i]]; } c[ks[ks.length-1]] = v; };
  let roleCb = null;
  const getRole = () => { try{ return sessionStorage.getItem(K+"-role"); }catch(e){ return null; } };
  const setRole = r => { try{ r ? sessionStorage.setItem(K+"-role", r) : sessionStorage.removeItem(K+"-role"); }catch(e){} roleCb && roleCb(r); };
  return {
    mode:"local",
    onAuth(cb){ roleCb = cb; cb(getRole()); },
    async loginTeacher(){ setRole("teacher"); },
    async enterStudent(){ setRole("student"); },
    async logout(){ setRole(null); },
    watchHWList(cb){ return sub(() => cb(Object.entries(D.hw).map(([id,h]) => ({id, ...clone(h)})).sort((a,b) => b.createdAt-a.createdAt))); },
    watchHW(id, cb){ return sub(() => cb(D.hw[id] ? {id, ...clone(D.hw[id])} : null)); },
    async createHW(o){ const id = "h"+Date.now().toString(36); D.hw[id] = clone(o); save(); return id; },
    async updateHW(id, p){ for(const [k,v] of Object.entries(p)) setPath(D.hw[id], k, v); save(); },
    async deleteHW(id){ delete D.hw[id]; delete D.msgs[id]; save(); },
    async saveRec(k, o){ D.rec[k] = o; save(true); },
    async loadRec(k){ return D.rec[k] ? clone(D.rec[k]) : null; },
    watchMsgs(id, cb){ return sub(() => cb(clone(D.msgs[id] || []))); },
    async addMsg(id, m){ (D.msgs[id] = D.msgs[id] || []).push(m); save(); },
    async getNote(id){ return D.notes[id] || ""; },
    async setNote(id, t){ D.notes[id] = t; save(true); },
    async getConfig(){ return D.config ? clone(D.config) : null; },
    async setConfig(o){ D.config = clone(o); save(true); },
    async createHWId(id, o){ D.hw[id] = clone(o); save(); },
  };
}
const recKey = (id,i,att) => `${id}_${i}_${att}`;
async function loadRec(k){ const r = await DB.loadRec(k); if(!r) return null; try{ return {dur:r.dur||0, ev:JSON.parse(r.data||"[]")}; }catch(e){ return null; } }
async function saveRec(k, snap){ const data = JSON.stringify(snap.ev); if(data.length > 900000) toast("풀이가 너무 길어요. 전체 지우기를 하고 이어서 써 주세요"); return DB.saveRec(k, {dur:snap.dur, data}); }

// ───────── 정답 확인 ─────────
function parseFrac(s){ // "2 3/5", "3/5", "2" → [분자, 분모] (가분수 값)
  const m = /^(?:(\d+)(?:\s+|$))?(?:(\d+)\s*\/\s*(\d+))?$/.exec(String(s ?? "").trim());
  if(!m || (!m[1] && !m[2])) return null;
  const w = +(m[1]||0), n = +(m[2]||0), d = +(m[3]||1);
  if(!d) return null;
  return [w*d+n, d];
}
function checkAns(a, key, kind){
  const n = s => String(s ?? "").trim().replace(/\s+/g," ").replace(/,/g,"");
  const x = n(a), y = n(key); if(!x) return false;
  if(kind==="frac"){ const p = parseFrac(x), q = parseFrac(y); return !!(p && q) && p[0]*q[1]===q[0]*p[1]; }
  if(kind==="div"){ const p = (x.match(/\d+/g)||[]).map(Number), q = (y.match(/\d+/g)||[]).map(Number); return p.length>0 && p[0]===q[0] && (p[1]||0)===(q[1]||0); }
  const num = /^-?\d*\.?\d+$|^-?\d+\.$/;
  if(num.test(x) && num.test(y)) return Math.abs(parseFloat(x) - parseFloat(y)) < 1e-9;
  return x.replace(/ /g,"") === y.replace(/ /g,"");
}

// ───────── 단원별 문제 만들기 ─────────
const ri = (a,b) => a + Math.floor(Math.random()*(b-a+1));
// 소수 (0.01 단위 정수로 계산 → 오차 없음)
const v1 = () => ri(0,9)*100 + ri(1,9)*10;
const f2 = () => { let f; do{ f = ri(1,99); }while(f%10===0); return f; };
const v2 = () => ri(0,9)*100 + f2();
function toStr(h,d){ const i=Math.floor(h/100), f=h%100; if(d===0) return String(i); if(d===1) return i+"."+Math.floor(f/10); return i+"."+String(f).padStart(2,"0"); }
const ansStr = h => toStr(h,2).replace(/0+$/,"").replace(/\.$/,"");
const decQ = p => ({q:`${toStr(p.a,p.da)} ${p.op} ${toStr(p.b,p.db)}`, ans:ansStr(p.op==="+" ? p.a+p.b : p.a-p.b), kind:"dec"});
function d1(h){ let ai,at,bi,bt; do{ ai=ri(0,9); at=ri(1,9); bi=ri(0,9); bt=ri(1,9); }while(h ? at+bt<10 : at+bt>9); return decQ({a:ai*100+at*10,da:1,b:bi*100+bt*10,db:1,op:"+"}); }
function d2(h){ let ai,at,bi,bt,a,b; do{ ai=ri(1,9); at=ri(1,9); bi=ri(0,ai); bt=ri(1,9); a=ai*100+at*10; b=bi*100+bt*10; }while(a<=b || (h ? at>=bt : at<bt)); return decQ({a,da:1,b,db:1,op:"−"}); }
function d3(h){ let a,b,c1,c2; do{ a=v2(); b=v2(); const ah=a%10,bh=b%10,at=Math.floor(a/10)%10,bt=Math.floor(b/10)%10; c1=ah+bh>=10; c2=at+bt+(c1?1:0)>=10; }while(h ? !(c1||c2) : (c1||c2)); return decQ({a,da:2,b,db:2,op:"+"}); }
function d4(h){ let a,b,br; do{ a=ri(1,9)*100+f2(); b=v2(); const ah=a%10,bh=b%10,at=Math.floor(a/10)%10,bt=Math.floor(b/10)%10; br=ah<bh||at<bt; }while(a<=b || (h ? !br : br)); return decQ({a,da:2,b,db:2,op:"−"}); }
function d5(h){
  if(!h){ const x={v:v1(),d:1}, y={v:v2(),d:2}; const [p,q] = Math.random()<.5 ? [x,y] : [y,x]; return decQ({a:p.v,da:p.d,b:q.v,db:q.d,op:"+"}); }
  const t = ri(1,3); let a,b,da,db;
  do{
    if(t===1){ a=ri(1,9)*100+ri(1,9)*10; da=1; b=v2(); db=2; }
    else if(t===2){ a=ri(1,9)*100+f2(); da=2; b=v1(); db=1; }
    else { a=ri(1,9)*100; da=0; if(Math.random()<.5){ b=v2(); db=2; } else { b=v1(); db=1; } }
  }while(a<=b);
  return decQ({a,da,b,db,op:"−"});
}
// 분모가 같은 분수 (값은 분자 정수로 계산)
const fr = (num,d) => { const w = Math.floor(num/d), n = num%d; return w && n ? `${w} ${n}/${d}` : w ? String(w) : `${n}/${d}`; };
const fracQ = (a,b,d,op) => ({q:`${fr(a,d)} ${op} ${fr(b,d)}`, ans:fr(op==="+" ? a+b : a-b, d), kind:"frac"});
function q1(h){ let d,a,b; do{ d=ri(3,12); a=ri(1,d-1); b=ri(1,d-1); }while(h ? a+b<=d : a+b>=d); return fracQ(a,b,d,"+"); }
function q2(h){ const d=ri(3,12); let a,b; do{ a=ri(2,d-1); b=ri(1,a-1); }while(false); return fracQ(a,b,d,"−"); }
function q3(h){ let d,n1,n2; do{ d=ri(3,10); n1=ri(1,d-1); n2=ri(1,d-1); }while(h ? n1+n2<=d : n1+n2>=d); const w1=ri(1,5), w2=ri(1,5); return fracQ(w1*d+n1, w2*d+n2, d, "+"); }
function q4(h){ let d,w1,w2,n1,n2; do{ d=ri(3,10); w1=ri(2,7); w2=ri(1,w1-1); n1=ri(1,d-1); n2=ri(1,d-1); }while(h ? n1>=n2 : n1<=n2); return fracQ(w1*d+n1, w2*d+n2, d, "−"); }
function q5(h){ const d=ri(3,10), a=ri(2,8), w=h ? ri(1,a-1) : 0, n=ri(1,d-1); return {q:`${a} − ${fr(w*d+n,d)}`, ans:fr(a*d-(w*d+n),d), kind:"frac"}; }
// 곱셈·나눗셈
function m1(h){ const a=ri(100,999), b=ri(1,9)*10; return {q:`${a} × ${b}`, ans:String(a*b), kind:"num"}; }
function m2(h){ const a=ri(100,999), b=ri(11,99); return {q:`${a} × ${b}`, ans:String(a*b), kind:"num"}; }
function n1(h){ let d,q,r,a; do{ d=ri(2,9)*10; q=ri(2,9); r=h ? ri(1,d-1) : 0; a=d*q+r; }while(a>=1000); return {q:`${a} ÷ ${d}`, ans:r ? `${q}…${r}` : String(q), kind:"div"}; }
function n2(h){ let d,q,r,a; do{ d=ri(11,99); q=ri(2,40); r=h ? ri(1,d-1) : 0; a=d*q+r; }while(a<100 || a>=1000); return {q:`${a} ÷ ${d}`, ans:r ? `${q}…${r}` : String(q), kind:"div"}; }

const STAGE = {}; UNITS.forEach(u => u.stages.forEach((s,i) => { s.unit = u.name; s.prev = i>0 && !u.stages[i-1].mix ? u.stages[i-1].id : null; STAGE[s.id] = s; }));
const stageName = id => STAGE[id] ? `${STAGE[id].unit} · ${STAGE[id].name}` : "";
const stageOptions = sel => UNITS.map(u => `<optgroup label="${u.name}">${u.stages.map(s => `<option value="${s.id}" ${s.id===sel?"selected":""}>${s.name}</option>`).join("")}</optgroup>`).join("");

function makeProblems(id, n){
  const st = STAGE[id], out = [], seen = new Set();
  const add = (gen, hard) => { let p, k=0; do{ p = gen(hard); k++; }while(seen.has(p.q) && k<50); seen.add(p.q); out.push(p); };
  if(st.mix){ for(let i=0;i<n;i++) add(STAGE[st.mix[ri(0,st.mix.length-1)]].gen, Math.random()<.7); return out; }
  const review = st.prev ? Math.max(1, Math.round(n/10)) : 0, rest = n-review, easy = Math.floor(rest/2);
  for(let i=0;i<easy;i++) add(st.gen, false);          // 쉬운 문제
  for(let i=0;i<rest-easy;i++) add(st.gen, true);      // 받아올림·받아내림·나머지 있는 문제
  for(let i=0;i<review;i++) add(STAGE[st.prev].gen, true); // 바로 앞 단계 복습
  return out;
}

}

// ───────── 판서판 (펜 기록 + 녹화) ─────────
const W = 1000, H = 700, ERASE_W = 36;
function drawStroke(ctx, s, lim=Infinity){
  const p = s.p; if(!p || !p.length) return;
  ctx.save();
  ctx.globalCompositeOperation = s.e ? "destination-out" : "source-over";
  ctx.strokeStyle = s.c; ctx.lineWidth = s.e ? ERASE_W : s.w; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(p[0], p[1]);
  let n = 0;
  for(let i=3;i<p.length;i+=3){ if(p[i+2] > lim) break; ctx.lineTo(p[i], p[i+1]); n++; }
  if(!n) ctx.lineTo(p[0]+0.1, p[1]);
  ctx.stroke(); ctx.restore();
}
function visibleStrokes(ev, T){ let a = []; for(const e of ev){ if(e.t > T) break; if(e.k==="s") a.push(e); else if(e.k==="c") a = []; else if(e.k==="u") a.pop(); } return a; }
function renderAt(ctx, ev, T){ ctx.clearRect(0,0,W,H); for(const s of visibleStrokes(ev,T)) drawStroke(ctx, s, T-s.t); }

class Board {
  constructor(wrap, readonly=false){
    this.wrap = wrap; this.cv = document.createElement("canvas"); wrap.appendChild(this.cv);
    this.ctx = this.cv.getContext("2d");
    this.ev = []; this.base = 0; this.t0 = performance.now(); this.readonly = readonly;
    this.tool = {c:"#222", w:4, e:0}; this.penSeen = false; this.finger = false; this.cur = null; this.dirty = false; this.onChange = null; this.paused = false;
    this.ro = new ResizeObserver(() => this.fit()); this.ro.observe(wrap);
    this.bind();
  }
  fit(){
    const r = this.wrap.getBoundingClientRect(); if(!r.width || !r.height) return;
    let w = r.width, h = w*H/W; if(h > r.height){ h = r.height; w = h*W/H; }
    const d = window.devicePixelRatio || 1;
    this.cv.style.width = w+"px"; this.cv.style.height = h+"px";
    this.cv.width = Math.round(w*d); this.cv.height = Math.round(h*d);
    this.ctx.setTransform(this.cv.width/W, 0, 0, this.cv.height/H, 0, 0);
    this.redraw();
  }
  now(){ return Math.round(this.paused ? this.base : this.base + performance.now() - this.t0); }
  pause(){ if(!this.paused){ this.base = this.now(); this.paused = true; } }
  resume(){ if(this.paused){ this.t0 = performance.now(); this.paused = false; } }
  load(rec){ this.ev = rec && rec.ev ? rec.ev : []; this.base = rec ? rec.dur||0 : 0; this.t0 = performance.now(); this.paused = false; this.dirty = false; this.cur = null; this.redraw(); }
  snap(){ return {dur:this.now(), ev:this.ev}; }
  redraw(T=Infinity){ renderAt(this.ctx, this.ev, T); }
  pos(e){ const r = this.cv.getBoundingClientRect(); return [Math.round((e.clientX-r.left)/r.width*W), Math.round((e.clientY-r.top)/r.height*H)]; }
  bind(){
    const c = this.cv;
    c.addEventListener("pointerdown", e => {
      if(this.readonly) return;
      if(e.pointerType==="pen") this.penSeen = true;
      if(e.pointerType==="touch" && this.penSeen && !this.finger) return;   // 펜을 쓰면 손바닥은 무시
      e.preventDefault(); try{ c.setPointerCapture(e.pointerId); }catch(_){}
      this.resume();
      const [x,y] = this.pos(e);
      this.cur = {k:"s", t:this.now(), c:this.tool.c, w:this.tool.w, e:this.tool.e, p:[x,y,0]}; this.curId = e.pointerId;
      this.ev.push(this.cur); drawStroke(this.ctx, this.cur);
    });
    c.addEventListener("pointermove", e => {
      if(!this.cur || e.pointerId!==this.curId) return; e.preventDefault();
      const list = (e.getCoalescedEvents && e.getCoalescedEvents().length) ? e.getCoalescedEvents() : [e];
      for(const ce of list){
        const [x,y] = this.pos(ce), p = this.cur.p, lx = p[p.length-3], ly = p[p.length-2];
        if(Math.abs(x-lx)+Math.abs(y-ly) < 2) continue;
        p.push(x, y, this.now()-this.cur.t); this.seg(lx,ly,x,y);
      }
    });
    const end = e => { if(!this.cur || e.pointerId!==this.curId) return; this.cur = null; this.changed(); };
    c.addEventListener("pointerup", end); c.addEventListener("pointercancel", end);
  }
  seg(x1,y1,x2,y2){ const s=this.cur, ctx=this.ctx; ctx.save(); ctx.globalCompositeOperation = s.e ? "destination-out" : "source-over"; ctx.strokeStyle = s.c; ctx.lineWidth = s.e ? ERASE_W : s.w; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore(); }
  undo(){ if(!visibleStrokes(this.ev, Infinity).length) return; this.ev.push({k:"u", t:this.now()}); this.redraw(); this.changed(); }
  clear(){ if(!visibleStrokes(this.ev, Infinity).length) return; this.ev.push({k:"c", t:this.now()}); this.redraw(); this.changed(); }
  changed(){ this.dirty = true; this.onChange && this.onChange(); }
  destroy(){ this.ro.disconnect(); this.cv.remove(); }
}

// 녹화 재생: 오래 멈춘 시간(1.5초 넘게)은 0.5초로 줄여서 보여 줘요
function compress(rec){
  const times = [];
  for(const e of rec.ev){ if(e.k==="s"){ for(let i=2;i<e.p.length;i+=3) times.push(e.t+e.p[i]); } else times.push(e.t); }
  times.sort((a,b)=>a-b);
  const Tm = [], Cm = []; let c = 0, prev = 0;
  for(const t of times){ const g = t-prev; c += g > 1500 ? 500 : g; Tm.push(t); Cm.push(c); prev = t; }
  const f = x => {
    let lo = 0, hi = Tm.length-1, k = -1;
    while(lo<=hi){ const m=(lo+hi)>>1; if(Tm[m]<=x){ k=m; lo=m+1; } else hi=m-1; }
    if(k<0) return Math.min(x, 500);
    const gapNext = k+1<Tm.length ? Cm[k+1]-Cm[k] : 500;
    return Cm[k] + Math.min(x-Tm[k], gapNext);
  };
  const ev = rec.ev.map(e => {
    if(e.k!=="s") return {...e, t:f(e.t)};
    const t = f(e.t), p = e.p.slice();
    for(let i=2;i<p.length;i+=3) p[i] = f(e.t+e.p[i]) - t;
    return {...e, t, p};
  });
  return {ev, dur:(times.length ? f(times[times.length-1]) : 0) + 300};
}

function statusOf(h){
  if(h.status==="graded") return ["채점 완료","done"];
  if(h.status==="submitted") return ["제출 완료","sub"];
  if(h.status==="round2") return ["다시 풀기","r2"];
  const any = h.st && Object.values(h.st).some(s => s && s.a1);
  return any ? ["푸는 중","ing"] : ["새 숙제","new"];
}
const stOf = (h,i) => (h.st && h.st[i]) || {};
const curAtt = h => h.round===2 ? 2 : 1;
function editable(h,i){ if(h.status==="submitted" || h.status==="graded") return false; if(h.round===2) return stOf(h,i).ok1===false; return true; }
const has = v => v!=null && String(v).trim()!=="";
const attempts = (h,i) => has(stOf(h,i).a2) ? 2 : has(stOf(h,i).a1) ? 1 : 0;
const finalOk = (h,i) => { const s = stOf(h,i); return s.ok2!=null ? s.ok2 : s.ok1; };
const gradeOk = (h,i) => { const g = h.grade && h.grade[i]; return g && g.ok!=null ? g.ok : finalOk(h,i); };

function solve(id){
  app.onclick = null;
  let hw = null, cur = -1, board = null, curKey = null, saveT = null, loadTok = 0, built = false, lastMsgN = -1, seenMsgN = 0;
  const flush = async () => { clearTimeout(saveT); if(board && board.dirty && curKey){ board.dirty = false; try{ await saveRec(curKey, board.snap()); }catch(e){ board.dirty = true; toast("풀이 저장 실패: 인터넷을 확인해 주세요"); } } };
  const onVis = () => { if(!board) return; if(document.hidden){ board.pause(); flush(); } };
  document.addEventListener("visibilitychange", onVis); window.addEventListener("pagehide", flush);
  cleanups.push(() => { flush(); document.removeEventListener("visibilitychange", onVis); window.removeEventListener("pagehide", flush); board && board.destroy(); });

  function build(){
    app.innerHTML = `<div class="solve">
      <aside class="plist">
        <div class="ph"><button class="link" id="back">← 목록</button><span class="jua" id="ttl"></span></div>
        <div class="rinfo" id="rinfo"></div>
        <div class="items" id="items"></div>
        <button class="big" id="submit">제출하기</button>
      </aside>
      <main class="pmain">
        <div class="phead"><span class="no" id="pno"></span><span class="chip" id="patt"></span></div>
        <div class="pq" id="pq"></div>
        <div class="lockmsg hide" id="lock"></div>
        <div class="tools" id="tools">
          <button class="tool on" data-c="#222"><span class="dot" style="background:#222"></span>검정</button>
          <button class="tool" data-c="#e5484d"><span class="dot" style="background:#e5484d"></span>빨강</button>
          <button class="tool" data-c="#2f6fde"><span class="dot" style="background:#2f6fde"></span>파랑</button>
          <button class="tool" data-er="1">🧽 지우개</button>
          <button class="tool" data-act="undo">↩ 되돌리기</button>
          <button class="tool" data-act="clear">🗑 전체 지우기</button>
          <button class="tool" data-act="finger">☝️ 손가락으로 쓰기</button>
        </div>
        <div class="boardwrap" id="bw"></div>
        <div id="ansbox">
          <div class="ansrow"><span class="lab">답</span><span class="row" id="ansin"></span><button class="big" id="chk">답 확인 ✔</button></div>
          <div class="anote muted" id="anote"></div>
        </div>
      </main>
    </div>
    <button class="fab" id="fab">💬<span class="nd hide" id="nd"></span></button>`;
    board = new Board($("#bw"));
    board.onChange = () => { clearTimeout(saveT); saveT = setTimeout(flush, 1500); };
    $("#back").onclick = () => go(studentHome);
    $("#items").onclick = e => { const b = e.target.closest(".it"); if(b) openProb(+b.dataset.i); };
    $("#tools").onclick = e => {
      const b = e.target.closest(".tool"); if(!b) return;
      if(b.dataset.act==="undo") return board.undo();
      if(b.dataset.act==="clear") return ask("전체 지울까요?", "지운 것도 녹화에는 남아요.", "지우기", "취소").then(y => y && board.clear());
      if(b.dataset.act==="finger"){ board.finger = !board.finger; b.classList.toggle("on", board.finger); return; }
      $("#tools").querySelectorAll("[data-c],[data-er]").forEach(x => x.classList.remove("on")); b.classList.add("on");
      board.tool = b.dataset.er ? {c:"#000", w:4, e:1} : {c:b.dataset.c, w:4, e:0};
    };
    $("#chk").onclick = checkCur;
    $("#ansin").onkeydown = e => { if(e.key==="Enter"){ e.preventDefault(); checkCur(); } };
    $("#submit").onclick = submit;
    $("#fab").onclick = () => { seenMsgN = lastMsgN; $("#nd").classList.add("hide"); openChatDrawer(id, "student"); };
    unsubs.push(DB.watchMsgs(id, list => {
      const n = list.length;
      if(lastMsgN<0){ seenMsgN = n; }
      lastMsgN = n;
      if(n > seenMsgN && list[n-1].from==="teacher" && !$(".drawer")) $("#nd").classList.remove("hide");
      if($(".drawer")) seenMsgN = n;
    }));
    built = true;
  }

  function renderSide(){
    $("#ttl").textContent = hw.title;
    const r2 = hw.round===2;
    $("#rinfo").className = "rinfo" + (r2 ? " r2" : "");
    $("#rinfo").textContent = r2 ? "틀린 문제 다시 풀기 (마지막 기회)" : "문제를 골라서 풀고, 답을 확인해요.";
    const att = curAtt(hw);
    $("#items").innerHTML = hw.problems.map((p,i) => {
      const s = stOf(hw,i), ed = editable(hw,i), a = s["a"+att], n = attempts(hw,i);
      let mark;
      if(r2 && !ed) mark = s.ok1===true ? `<b style="color:var(--ok)">⭕</b>맞았어요` : `<b style="color:var(--blue)">✔</b>선생님 채점`;
      else if(r2) mark = has(a) ? `<b style="color:var(--blue)">✔</b>다시 풀었어요` : `<b style="color:var(--bad)">!</b>다시 풀기`;
      else mark = has(a) ? `<b style="color:var(--blue)">✔</b>풀이 ${n}회` : `<b style="color:#cdbfb3">○</b>`;
      return `<button class="it ${i===cur?"cur":""} ${ed?"":"locked"}" data-i="${i}"><span class="n">${i+1}</span><span class="q">${richQ(p.q)}</span><span class="s">${mark}</span></button>`;
    }).join("");
    const left = hw.problems.filter((p,i) => editable(hw,i) && !has(stOf(hw,i)["a"+att])).length;
    $("#submit").disabled = left>0;
    $("#submit").textContent = left>0 ? `제출하기 (${left}문제 남음)` : (r2 ? "마지막 제출하기" : "제출하기");
  }

  async function openProb(i){
    if(i===cur) return;
    await flush();
    cur = i; const tok = ++loadTok;
    const p = hw.problems[i], ed = editable(hw,i), att = curAtt(hw), s = stOf(hw,i);
    $("#pno").textContent = `${i+1}번`;
    $("#patt").textContent = ed ? (att===2 ? "2번째 풀이 (마지막)" : "1번째 풀이") : "다 풀었어요";
    $("#patt").className = "chip" + (ed && att===2 ? " r2" : "");
    $("#pq").innerHTML = richQ(p.q) + (/^[\d.\s+\-−×÷*/()]+$/.test(p.q) ? " =" : "");
    $("#tools").classList.toggle("hide", !ed);
    $("#ansbox").classList.toggle("hide", !ed);
    $("#lock").classList.toggle("hide", ed);
    if(!ed) $("#lock").textContent = s.ok1===true ? `⭕ 1번째에 맞았어요! (내 답: ${s.a1})` : `✔ 이 문제는 선생님이 채점해요. (내 답: ${s.a1})`;
    ansUI(p.kind, s["a"+att] || "");
    const tip = p.kind==="frac" ? "대분수면 왼쪽 칸에 자연수를 써요. " : p.kind==="div" ? "나머지가 없으면 나머지 칸은 비워 둬요. " : "";
    $("#anote").textContent = att===2 && ed ? `1번째 답 ${s.a1} 은(는) 틀렸어요. 다시 천천히 풀어 봐요!` : (has(s["a"+att]) ? "답을 적었어요. 고치고 싶으면 다시 써서 답 확인을 눌러요." : tip);
    renderSide();
    const key = recKey(id, i, ed ? att : 1);
    curKey = null; board.readonly = true; board.load(null);
    const rec = await loadRec(key);
    if(tok!==loadTok) return;
    board.load(rec); board.readonly = !ed; curKey = ed ? key : null;
  }

  async function checkCur(){
    const r = readAns(hw.problems[cur].kind); if(r.err){ toast(r.err); return; }
    const v = r.v, i = cur, att = curAtt(hw);
    await flush();
    try{ await DB.updateHW(id, {[`st.${i}.a${att}`]: v, lastAt: Date.now()}); }catch(e){ toast("저장 실패: 인터넷을 확인해 주세요"); return; }
    toast("답을 적었어요 ✔");
    setTimeout(() => {
      if(cur!==i) return;
      const next = hw.problems.findIndex((p,j) => j!==i && editable(hw,j) && !has(stOf(hw,j)["a"+att]));
      if(next>=0) openProb(next);
    }, 500);
  }

  async function submit(){
    const r2 = hw.round===2;
    if(!await ask(r2 ? "마지막으로 제출할까요?" : "제출할까요?", r2 ? "이번이 마지막 기회예요." : "틀린 문제가 있으면 한 번 더 풀 수 있어요.", "제출하기", "더 볼래요")) return;
    await flush();
    const att = curAtt(hw), patch = {}; let wrong = 0;
    hw.problems.forEach((p,i) => { if(!editable(hw,i)) return; const ok = has(p.ans) ? checkAns(stOf(hw,i)["a"+att], p.ans, p.kind) : null; patch[`st.${i}.ok${att}`] = ok; if(ok===false) wrong++; });
    if(att===1 && wrong>0){ patch.status = "round2"; patch.round = 2; }
    else { patch.status = "submitted"; patch.submittedAt = Date.now(); }
    try{ await DB.updateHW(id, patch); }catch(e){ toast("제출 실패: 인터넷을 확인해 주세요"); return; }
    if(patch.status==="round2"){
      await tell("한 번 더 풀어 봐요! 💪", `틀린 문제가 <b>${wrong}개</b> 있어요.<br>빨간 느낌표(!) 문제를 다시 풀어요. 이번이 마지막 기회예요.`, "다시 풀기");
      cur = -1; const first = hw.problems.findIndex((p,i) => editable(hw,i)); if(first>=0) openProb(first);
    } else {
      await tell("제출 완료! 🎉", "수고했어요! 선생님이 채점하면 끝낸 숙제에서 볼 수 있어요.");
      go(studentHome);
    }
  }

  unsubs.push(DB.watchHW(id, h => {
    if(!h){ go(studentHome); return; }
    const roundChanged = hw && hw.round!==h.round;
    hw = h;
    if(h.status==="submitted" || h.status==="graded"){ if(!built) go(studentResult, id); return; }
    if(!built){ build(); renderSide(); const first = h.problems.findIndex((p,i) => editable(h,i) && !has(stOf(h,i)["a"+curAtt(h)])); openProb(first>=0 ? first : 0); }
    else if(!roundChanged) renderSide();
  }));
}

// ───────── 답 칸 (단원마다 다르게) ─────────
function ansUI(kind, val){
  const box = $("#ansin");
  if(kind==="frac"){
    const m = /^(?:(\d+)(?:\s+|$))?(?:(\d+)\/(\d+))?$/.exec(val) || [];
    box.innerHTML = `<input class="inp sm" id="aw" inputmode="numeric" autocomplete="off" value="${m[1]||""}"><span class="fin"><input class="inp sm" id="an" inputmode="numeric" autocomplete="off" value="${m[2]||""}"><span class="fl"></span><input class="inp sm" id="ad" inputmode="numeric" autocomplete="off" value="${m[3]||""}"></span>`;
  } else if(kind==="div"){
    const m = val.match(/\d+/g) || [];
    box.innerHTML = `<span class="lab2">몫</span><input class="inp sm" id="aq" inputmode="numeric" autocomplete="off" value="${m[0]||""}"><span class="lab2">나머지</span><input class="inp sm" id="ar" inputmode="numeric" autocomplete="off" value="${m[1]||""}">`;
  } else {
    box.innerHTML = `<input class="inp" id="ans" inputmode="${kind ? "decimal" : "text"}" autocomplete="off" placeholder="답을 써요" value="${esc(val)}">`;
  }
}
function readAns(kind){
  if(kind==="frac"){
    const w = $("#aw").value.trim(), n = $("#an").value.trim(), d = $("#ad").value.trim();
    if((n && !d) || (!n && d)) return {err:"분자와 분모를 둘 다 써 주세요"};
    if(!w && !n) return {err:"답을 먼저 써 주세요"};
    return {v:[w, n ? `${n}/${d}` : ""].filter(Boolean).join(" ")};
  }
  if(kind==="div"){
    const q = $("#aq").value.trim(), r = $("#ar").value.trim();
    if(!q) return {err:"몫을 먼저 써 주세요"};
    return {v: r && +r ? `${q}…${r}` : q};
  }
  const v = $("#ans").value.trim(); return v ? {v} : {err:"답을 먼저 써 주세요"};
}

// ───────── 자동 숙제 ─────────
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const nextNum = list => { const nums = list.map(h => +(/(\d+)\s*$/.exec(h.title)||[])[1]).filter(Boolean); return (nums.length ? Math.max(...nums) : 0) + 1; };
let autoTried = "";
async function ensureAuto(list, force=false){
  const d = new Date(), key = dayKey(d);
  if(autoTried===key && !force) return; autoTried = key;
  let c; try{ c = await DB.getConfig(); }catch(e){ return; }
  if(!c || !c.on || !(c.stages||[]).length || !(c.days||[]).includes(d.getDay())) return;
  const id = "auto-"+key; if(list.some(h => h.id===id)) return;
  const sid = c.stages[list.filter(h => h.auto).length % c.stages.length]; if(!STAGE[sid]) return;
  try{ await DB.createHWId(id, {title:`${STUDENT} 수학과제${nextNum(list)}`, problems:makeProblems(sid, c.count||10), createdAt:Date.now(), status:"assigned", round:1, st:{}, grade:{}, memo:"", auto:true, stage:sid}); }catch(e){}
}

// ───────── 채팅 ─────────
function chatBox(el, id, me){
  el.innerHTML = `<div class="chat"><div class="msgs"></div><form class="cin"><input class="inp" placeholder="메시지를 써요" maxlength="500"><button class="big blue">보내기</button></form></div>`;
  const box = el.querySelector(".msgs");
  const u = DB.watchMsgs(id, list => {
    box.innerHTML = list.length ? list.map(m => `<div class="msg ${m.from===me?"me":""}"><div class="who">${m.from==="teacher" ? "선생님" : esc(STUDENT)}</div><div class="bub">${esc(m.text)}</div><div class="when">${fmtDT(m.at)}</div></div>`).join("") : `<div class="empty">아직 대화가 없어요. 궁금한 걸 물어봐요!</div>`;
    box.scrollTop = box.scrollHeight;
  });
  el.querySelector("form").onsubmit = async e => {
    e.preventDefault(); const inp = el.querySelector("input"), t = inp.value.trim(); if(!t) return;
    inp.value = "";
    try{ await DB.addMsg(id, {from:me, text:t, at:Date.now()}); }catch(err){ inp.value = t; toast("보내기 실패: 인터넷을 확인해 주세요"); }
  };
  return u;
}
function openChatDrawer(id, me){
  if($(".drawer")) return;
  const d = document.createElement("div"); d.className = "drawer";
  d.innerHTML = `<div class="bar" style="margin-bottom:8px"><h1 style="font-size:22px">💬 ${me==="student" ? "선생님께 말하기" : esc(STUDENT)+"와 대화"}</h1><button class="link" id="dclose">닫기 ✕</button></div><div id="dchat" style="flex:1;min-height:0;display:flex"></div>`;
  layer.appendChild(d);
  const u = chatBox($("#dchat", d), id, me);
  $("#dchat .chat", d).style.flex = "1";
  $("#dclose", d).onclick = () => { u && u(); d.remove(); };
}

// ───────── 녹화 보기 ─────────
async function openPlayer(title, key){
  const rec = await loadRec(key);
  if(!rec || !rec.ev.length){ tell("녹화가 없어요", "이 풀이에는 쓴 내용이 없어요."); return; }
  const m = modal(`<div class="bar" style="margin-bottom:6px"><h3 style="margin:0">${title}</h3><button class="link" data-x>닫기 ✕</button></div>
    <div class="boardwrap" data-bw></div>
    <div class="pctl">
      <button class="btn" data-play style="min-width:64px">▶ 재생</button>
      <input type="range" min="0" max="1000" value="0" data-rg>
      <span class="tm" data-tm></span>
    </div>
    <div class="pctl">
      <span class="muted">빠르기</span>
      <button class="btn" data-sp="1">1배</button><button class="btn on" data-sp="2">2배</button><button class="btn" data-sp="4">4배</button>
      <label class="muted" style="display:flex;align-items:center;gap:4px;margin-left:auto"><input type="checkbox" data-skip checked>멈춘 시간 건너뛰기</label>
    </div>
    <div class="muted" data-info style="margin-top:6px"></div>`, true);
  const b = new Board(m.querySelector("[data-bw]"), true);
  let R = compress(rec), T = 0, speed = 2, playing = false, last = 0, raf = 0;
  const info = () => { m.querySelector("[data-info]").textContent = `실제로 푼 시간 ${fmtSec(rec.dur)} · 획 ${rec.ev.filter(e=>e.k==="s").length}개`; };
  const draw = () => { renderAt(b.ctx, R.ev, T); m.querySelector("[data-tm]").textContent = `${fmtSec(T)} / ${fmtSec(R.dur)}`; m.querySelector("[data-rg]").value = R.dur ? Math.round(T/R.dur*1000) : 0; };
  b.redraw = () => draw();
  const tick = now => { if(!playing) return; T += (now-last)*speed; last = now; if(T >= R.dur){ T = R.dur; playing = false; m.querySelector("[data-play]").textContent = "▶ 재생"; } draw(); if(playing) raf = requestAnimationFrame(tick); };
  const play = () => { if(T >= R.dur) T = 0; playing = true; last = performance.now(); m.querySelector("[data-play]").textContent = "⏸ 멈춤"; raf = requestAnimationFrame(tick); };
  const stop = () => { playing = false; cancelAnimationFrame(raf); m.querySelector("[data-play]").textContent = "▶ 재생"; };
  m.querySelector("[data-play]").onclick = () => playing ? stop() : play();
  m.querySelector("[data-rg]").oninput = e => { stop(); T = e.target.value/1000*R.dur; draw(); };
  m.querySelectorAll("[data-sp]").forEach(x => x.onclick = () => { speed = +x.dataset.sp; m.querySelectorAll("[data-sp]").forEach(y => y.classList.toggle("on", y===x)); });
  m.querySelector("[data-skip]").onchange = e => { const r = T/(R.dur||1); R = e.target.checked ? compress(rec) : {ev:rec.ev, dur:rec.dur+300}; T = r*R.dur; draw(); };
  m.querySelector("[data-x]").onclick = () => { stop(); b.destroy(); m.remove(); };
  info(); draw(); play();
}

          ${has(s.a2) ? `<div class="att"><span class="lb">2번째 답</span><b>${esc(s.a2)}</b> ${s.ok2===true ? `<span class="okc">맞음</span>` : s.ok2===false ? `<span class="badc">틀림</span>` : ""} <button class="btn" data-k="${recKey(id,i,2)}" data-t="${i+1}번 · 2번째 풀이">내 풀이 보기</button></div>` : ""}
          ${g && fo===false && has(p.ans) ? `<div class="att"><span class="lb">정답</span><b style="color:var(--ok)">${esc(p.ans)}</b></div>` : ""}
          ${g && gr && has(gr.memo) ? `<div class="att"><span class="lb">선생님</span><span>${esc(gr.memo)}</span></div>` : ""}</div>`;
      }).join("")}</div>`;
  }));
  app.onclick = e => { const b = e.target.closest("[data-k]"); if(b) openPlayer(b.dataset.t, b.dataset.k); };
}

function teacherHome(){
  app.onclick = null;
  app.innerHTML = `<div class="page">${topBar("선생님 숙제방", "선생님")}
    <div class="card" id="auto"><h2>🤖 자동 숙제</h2>
      <label class="row" style="font-size:17px;font-weight:700"><input type="checkbox" id="aon" style="width:22px;height:22px"> 자동으로 숙제 내기</label>
      <div class="muted" style="margin:6px 0 4px">고른 단원이 순서대로 돌아가며 하루에 한 숙제씩 나가요. ${esc(STUDENT)}가 앱을 여는 날 그날 숙제가 생겨요.</div>
      ${UNITS.map(u => `<div class="ugrp"><div class="muted">${u.name}</div><div class="row">${u.stages.map(st => `<button class="btn" data-as="${st.id}">${st.name}</button>`).join("")}</div></div>`).join("")}
      <div class="ugrp"><div class="muted">문제 수</div><div class="row">${[5,10,15,20].map(n => `<button class="btn" data-ac="${n}">${n}문제</button>`).join("")}</div></div>
      <div class="ugrp"><div class="muted">요일</div><div class="row">${[1,2,3,4,5,6,0].map(d => `<button class="btn" data-ad="${d}">${days[d]}</button>`).join("")}</div></div>
      <div class="muted" id="anext" style="margin:8px 0"></div>
      <button class="big blue" id="asave">자동 숙제 저장</button>
    </div>
    <button class="big" id="new">+ 직접 숙제 내기</button>
    <div class="card" style="margin-top:14px"><h2>낸 숙제</h2><div class="hwlist" id="list"></div></div></div>`;
  bindOut();
  $("#new").onclick = () => go(teacherCreate);
  let cfg = {on:false, stages:[], count:10, days:[1,2,3,4,5]}, curList = [];
  const paint = () => {
    $("#aon").checked = !!cfg.on;
    document.querySelectorAll("[data-as]").forEach(b => { const k = cfg.stages.indexOf(b.dataset.as); b.classList.toggle("on", k>=0); b.textContent = (k>=0 ? `${k+1}. ` : "") + STAGE[b.dataset.as].name; });
    document.querySelectorAll("[data-ac]").forEach(b => b.classList.toggle("on", +b.dataset.ac===cfg.count));
    document.querySelectorAll("[data-ad]").forEach(b => b.classList.toggle("on", cfg.days.includes(+b.dataset.ad)));
    let t = "";
    if(!cfg.on) t = "지금은 꺼져 있어요.";
    else if(!cfg.stages.length) t = "단원을 하나 이상 골라 주세요.";
    else if(!cfg.days.length) t = "요일을 하나 이상 골라 주세요.";
    else {
      let d = new Date(); const todayDone = curList.some(h => h.id==="auto-"+dayKey(d));
      if(todayDone || !cfg.days.includes(d.getDay())){ for(let k=0;k<7;k++){ d = new Date(d.getTime()+864e5); if(cfg.days.includes(d.getDay())) break; } }
      const sid = cfg.stages[curList.filter(h => h.auto).length % cfg.stages.length];
      t = `다음 숙제: ${fmtD(d.getTime())} · ${stageName(sid)} · ${cfg.count}문제`;
    }
    $("#anext").textContent = t;
  };
  DB.getConfig().then(c => { if(c) cfg = {...cfg, ...c}; paint(); }).catch(() => paint());
  $("#auto").onclick = e => {
    const b = e.target.closest("button"); if(!b) return;
    if(b.dataset.as){ const k = cfg.stages.indexOf(b.dataset.as); k>=0 ? cfg.stages.splice(k,1) : cfg.stages.push(b.dataset.as); }
    else if(b.dataset.ac) cfg.count = +b.dataset.ac;
    else if(b.dataset.ad){ const d = +b.dataset.ad, k = cfg.days.indexOf(d); k>=0 ? cfg.days.splice(k,1) : cfg.days.push(d); }
    else if(b.id==="asave"){
      DB.setConfig({...cfg, on:$("#aon").checked}).then(() => { cfg.on = $("#aon").checked; toast("자동 숙제를 저장했어요"); ensureAuto(curList, true); paint(); }).catch(() => toast("저장 실패: 인터넷을 확인해 주세요"));
      return;
    }
    paint();
  };
  $("#aon").onchange = () => { cfg.on = $("#aon").checked; paint(); };
  unsubs.push(DB.watchHWList(list => {
    curList = list; paint();
    $("#list").innerHTML = list.length ? list.map(h => {
      const [lab,cls] = statusOf(h), n = h.problems.length;
      let sc = "";
      if(h.status==="graded") sc = `최종 ${h.problems.filter((_,i)=>gradeOk(h,i)===true).length}/${n}`;
      else if(h.status==="submitted") sc = `1번째 ${h.problems.filter((_,i)=>stOf(h,i).ok1===true).length}/${n} → 최종 ${h.problems.filter((_,i)=>finalOk(h,i)===true).length}/${n}`;
      else sc = `답 ${h.problems.filter((_,i)=>attempts(h,i)>0).length}/${n}`;
      return `<button class="hw" data-id="${h.id}"><div class="grow"><div class="ti">${h.auto?"🤖 ":""}${esc(h.title)}</div><div class="muted">${fmtD(h.createdAt)}${h.stage?` · ${STAGE[h.stage]?STAGE[h.stage].name:""}`:""} · ${sc}</div></div><span class="chip ${cls}">${lab}</span></button>`;
    }).join("") : `<div class="empty">아직 낸 숙제가 없어요.</div>`;
  }));
  app.onclick = e => { const b = e.target.closest(".hw"); if(b) go(teacherGrade, b.dataset.id); };
}

// ───────── 선생님: 숙제 만들기 ─────────
function teacherCreate(){
  app.onclick = null;
  app.innerHTML = `<div class="page"><div class="bar"><button class="link" id="back">← 목록</button></div>
    <div class="card" id="memoCard" style="display:none;background:#fff3c4"><h2>📌 지난 숙제 메모 (나만 보기)</h2><div id="lastMemo" style="white-space:pre-wrap"></div></div>
    <div class="card"><h2>숙제 제목</h2><input class="inp" id="title"></div>
    <div class="card"><h2>단원 골라서 문제 넣기</h2>
      <div class="row">
        <select class="inp" id="stage" style="flex:2;min-width:200px">${stageOptions("dec1")}</select>
        <select class="inp" id="cnt" style="flex:1;min-width:90px">${[5,10,15,20].map(n=>`<option ${n===10?"selected":""}>${n}</option>`).join("")}</select>
      </div>
      <button class="big gray" id="gen" style="margin-top:10px">문제 넣기</button>
      <div class="muted" style="margin-top:8px">쉬운 문제 → 받아올림·받아내림 문제 → 지난 단계 복습 순서로 들어가요.</div>
    </div>
    <div class="card"><h2>문제 목록 <span class="muted" id="pc"></span></h2>
      <div class="muted" style="margin-bottom:8px">정답 칸을 비워 두면 자동 채점 없이 선생님이 직접 채점해요.</div>
      <div id="rows"></div>
      <div class="row" style="margin-top:8px"><button class="btn" id="add">+ 직접 문제 추가</button><button class="btn" id="clr">모두 지우기</button></div>
    </div>
    <button class="big" id="send">숙제 내기</button></div>`;
  $("#back").onclick = () => go(teacherHome);
  const rows = $("#rows");
  const addRow = (q="", a="", kind="") => { const d = document.createElement("div"); d.className = "prow"; d.dataset.kind = kind; d.innerHTML = `<span class="n"></span><input class="inp" data-q placeholder="문제" value="${esc(q)}"><input class="inp" data-a placeholder="정답" value="${esc(a)}"><button class="btn" data-del>✕</button>`; rows.appendChild(d); renum(); };
  const renum = () => { [...rows.children].forEach((r,i) => r.querySelector(".n").textContent = i+1); $("#pc").textContent = `(${rows.children.length}문제)`; };
  rows.onclick = e => { if(e.target.closest("[data-del]")){ e.target.closest(".prow").remove(); renum(); } };
  $("#gen").onclick = () => { makeProblems($("#stage").value, +$("#cnt").value).forEach(p => addRow(p.q, p.ans, p.kind)); };
  $("#add").onclick = () => { addRow(); rows.lastChild.querySelector("[data-q]").focus(); };
  $("#clr").onclick = async () => { if(rows.children.length && await ask("모두 지울까요?", "문제 목록이 비워져요.", "지우기", "취소")){ rows.innerHTML = ""; renum(); } };
  renum();
  const u = DB.watchHWList(async list => {
    if($("#title").dataset.set) return; $("#title").dataset.set = 1;
    $("#title").value = `${STUDENT} 수학과제${nextNum(list)}`;
    const g = list.find(h => h.status==="graded");
    if(g){ const t = await DB.getNote(g.id); if(has(t)){ $("#memoCard").style.display = ""; $("#lastMemo").textContent = `[${g.title}] ${t}`; } }
  });
  unsubs.push(u);
  $("#send").onclick = async () => {
    const problems = [...rows.children].map(r => ({q:r.querySelector("[data-q]").value.trim(), ans:r.querySelector("[data-a]").value.trim(), kind:r.dataset.kind||""})).filter(p => p.q);
    const title = $("#title").value.trim();
    if(!title) return toast("제목을 써 주세요");
    if(!problems.length) return toast("문제를 하나 이상 넣어 주세요");
    if(!await ask("숙제를 낼까요?", `${esc(title)} · ${problems.length}문제`, "숙제 내기", "취소")) return;
    try{ await DB.createHW({title, problems, createdAt:Date.now(), status:"assigned", round:1, st:{}, grade:{}, memo:""}); toast("숙제를 냈어요!"); go(teacherHome); }
    catch(e){ toast("저장 실패: 인터넷을 확인해 주세요"); }
  };
}

// ───────── 선생님: 채점 ─────────
function teacherGrade(id){
  app.onclick = null;
  let hw = null, dirty = false, built = false;
  app.innerHTML = `<div class="page"><div class="bar"><button class="link" id="back">← 목록</button><button class="link" id="del" style="color:var(--bad)">숙제 지우기</button></div>
    <div id="upd" class="banner hide"><span>${esc(STUDENT)}가 새로 풀었어요.</span><button class="btn" id="reload">새로 보기</button></div>
    <div id="body"></div>
    <div class="card"><h2>💬 ${esc(STUDENT)}와 대화</h2><div id="chat"></div></div></div>`;
  $("#back").onclick = async () => { if(dirty && !await ask("채점을 저장하지 않았어요", "저장하지 않고 나갈까요?", "나가기", "취소")) return; go(teacherHome); };
  $("#del").onclick = async () => { if(await ask("숙제를 지울까요?", "지우면 되돌릴 수 없어요.", "지우기", "취소")){ await DB.deleteHW(id); go(teacherHome); } };
  $("#reload").onclick = () => { dirty = false; render(); };
  unsubs.push(chatBox($("#chat"), id, "teacher"));

  async function render(){
    $("#upd").classList.add("hide");
    const h = hw, n = h.problems.length, [lab,cls] = statusOf(h), canGrade = ["submitted","graded"].includes(h.status);
    const ok1N = h.problems.filter((_,i)=>stOf(h,i).ok1===true).length, finN = h.problems.filter((_,i)=>finalOk(h,i)===true).length;
    const note = await DB.getNote(id);
    $("#body").innerHTML = `<div class="card">
        <div class="row" style="justify-content:space-between"><span class="jua" style="font-size:26px">${esc(h.title)}</span><span class="chip ${cls}">${lab}</span></div>
        <div class="muted" style="margin-top:4px">낸 날 ${fmtD(h.createdAt)}${h.submittedAt ? ` · 제출한 날 ${fmtD(h.submittedAt)}` : ""}</div>
        ${canGrade ? `<div class="sum" style="margin-top:8px">1번째 ${ok1N}/${n} 맞음 → 최종 ${finN}/${n} 맞음 <span class="muted">(자동 채점)</span></div>` : `<div class="muted" style="margin-top:8px">${esc(STUDENT)}가 아직 제출하지 않았어요. 풀고 있는 녹화는 지금도 볼 수 있어요.</div>`}
      </div>
      <div class="card"><h2>문제별 채점</h2>${h.problems.map((p,i) => {
        const s = stOf(h,i), gr = (h.grade && h.grade[i]) || {}, ok = gradeOk(h,i);
        const line = (k) => { const a = s["a"+k], o = s["ok"+k]; if(!has(a) && k===2) return ""; return `<div class="att"><span class="lb">${k}번째 답</span><b>${esc(a ?? "-")}</b> ${o===true ? `<span class="okc">✔ 맞음</span>` : o===false ? `<span class="badc">✗ 틀림</span>` : ""} <button class="btn" data-k="${recKey(id,i,k)}" data-t="${i+1}번 ${esc(p.q)} · ${k}번째 풀이">▶ 풀이 보기</button></div>`; };
        return `<div class="gq" data-i="${i}"><div class="top"><span class="no">${i+1}번</span><span class="qq">${richQ(p.q)}</span><span class="muted">정답 ${has(p.ans) ? esc(p.ans) : "(직접 채점)"}</span><span class="muted">· 풀이 ${attempts(h,i)}회</span></div>
          ${line(1)}${line(2)}
          <div class="att"><span class="lb">채점</span><button class="btn ok ${ok===true?"on":""}" data-g="1" ${canGrade?"":"disabled"}>⭕ 맞음</button><button class="btn bad ${ok===false?"on":""}" data-g="0" ${canGrade?"":"disabled"}>❌ 틀림</button></div>
          <div class="att"><span class="lb">메모</span><input class="inp" data-m style="flex:1" placeholder="이 문제에 대한 말 (${esc(STUDENT)}에게 보여요)" value="${esc(gr.memo || "")}"></div></div>`;
      }).join("")}</div>
      <div class="card"><h2>📝 ${esc(STUDENT)}에게 한마디 <span class="muted">(${esc(STUDENT)}에게 보여요)</span></h2><textarea class="inp" id="memo" placeholder="예) 받아내림을 잘했어요! 소수점 위치만 조심해요.">${esc(h.memo || "")}</textarea></div>
      <div class="card" style="background:#fff3c4"><h2>📌 나만 보는 메모 <span class="muted">(다음 숙제 낼 때 보여요)</span></h2><textarea class="inp" id="note" placeholder="예) 자릿수 다른 뺄셈에서 빈자리 0을 안 채움 → 다음엔 5단계 더">${esc(note)}</textarea><button class="btn" id="saveNote" style="margin-top:8px">메모만 저장</button></div>
      <button class="big" id="save" ${canGrade?"":"disabled"}>${h.status==="graded" ? "채점 고친 것 저장" : "채점 완료하기"}</button>`;
    built = true;
  }
  app.onclick = async e => {
    const pb = e.target.closest("[data-k]"); if(pb) return openPlayer(pb.dataset.t, pb.dataset.k);
    const gb = e.target.closest("[data-g]");
    if(gb && !gb.disabled){ const q = gb.closest(".gq"); q.querySelectorAll("[data-g]").forEach(b => b.classList.toggle("on", b===gb)); dirty = true; return; }
    if(e.target.id==="saveNote"){ await DB.setNote(id, $("#note").value); toast("메모를 저장했어요"); return; }
    if(e.target.id==="save"){
      const grade = {}; let miss = 0;
      document.querySelectorAll(".gq").forEach(q => { const i = q.dataset.i, on = q.querySelector("[data-g].on"); if(!on) miss++; grade[i] = {ok: on ? on.dataset.g==="1" : null, memo: q.querySelector("[data-m]").value.trim()}; });
      if(miss && !await ask("채점 안 한 문제가 있어요", `${miss}문제가 비어 있어요. 그래도 저장할까요?`, "저장", "취소")) return;
      try{
        await DB.setNote(id, $("#note").value);
        await DB.updateHW(id, {grade, memo:$("#memo").value.trim(), status:"graded", gradedAt:Date.now()});
        dirty = false; toast(`채점 완료! ${STUDENT}에게 보여요`);
      }catch(err){ toast("저장 실패: 인터넷을 확인해 주세요"); }
    }
  };
  app.oninput = e => { if(e.target.closest("#body") && e.target.id!=="note") dirty = true; };
  cleanups.push(() => { app.oninput = null; });
  unsubs.push(DB.watchHW(id, h => {
    if(!h){ go(teacherHome); return; }
    hw = h;
    if(!built || !dirty) render(); else $("#upd").classList.remove("hide");
  }));
}

// ───────── 시작 ─────────
(async () => {
  try{ DB = FIREBASE_CONFIG ? await makeFirebase() : makeLocal(); }
  catch(e){ app.innerHTML = `<div class="center"><h1>앗!</h1><p>연결할 수 없어요. 인터넷을 확인하고 새로 고침해 주세요.</p></div>`; return; }
  if(DB.mode==="local"){ const d = $("#demo"); d.classList.remove("hide"); d.innerHTML = "🧪 <b>체험 모드</b> — 지금은 이 기기에만 저장돼요. 안내서대로 설정하면 수아와 선생님이 서로 다른 기기에서 함께 쓸 수 있어요. (같은 컴퓨터에서 창을 두 개 열어 한쪽은 선생님, 한쪽은 수아로 들어가면 미리 써 볼 수 있어요.)"; }
  let first = true;
  DB.onAuth(r => {
    if(!first && r===role) return; first = false; role = r;
    if(r==="teacher") go(teacherHome);
    else if(r==="student") go(studentHome);
    else go(startScreen);
  });
})();
</script>
</body>
</html>
